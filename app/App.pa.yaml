App:
  Properties:
    Formulas: |-
      =// ---------- Identity and role (Staff row for the signed-in user) ----------
      CurrentUserRow = LookUp(Users, 'Primary Email' = User().Email);
      CurrentStaff = LookUp(Staff, User.User = CurrentUserRow.User);
      StaffReady = !IsBlank(CurrentStaff) && CurrentStaff.Active <> false;
      IsTeacherRole = StaffReady && CurrentStaff.'App Role' = 'App Role (Staff)'.Teacher;
      IsOfficeRole = StaffReady && CurrentStaff.'App Role' = 'App Role (Staff)'.'Attendance Office';
      IsAdminRole = StaffReady && CurrentStaff.'App Role' = 'App Role (Staff)'.'System Admin';
      IsReadOnlyRole = StaffReady && CurrentStaff.'App Role' = 'App Role (Staff)'.'Read-only';
      CanEditRole = IsTeacherRole || IsOfficeRole || IsAdminRole;
      CanPickCampus = IsAdminRole || IsReadOnlyRole;
      CanPickTeacher = IsOfficeRole || IsAdminRole || IsReadOnlyRole;
      RoleLabel = If(StaffReady, Text(CurrentStaff.'App Role'), "Not set up");
      // ---------- Settings ----------
      AllowFutureDates = Lower(Trim(LookUp('App Settings', Key = "AllowFutureDates").Value)) = "true";
      ZeroGuid = GUID("00000000-0000-0000-0000-000000000000");
      // ---------- Palette: NEXUS (Resource Center agent icon: deep navy, electric blue, violet, cyan) ----------
      ColorPaper = RGBA(244, 246, 252, 1);
      ColorInk = RGBA(15, 22, 58, 1);        // deep navy: header band and primary text
      ColorInkSoft = RGBA(196, 208, 255, 1); // periwinkle: secondary text on navy
      ColorWhite = RGBA(255, 255, 255, 1);
      ColorTeal = RGBA(37, 99, 235, 1);      // accent (name kept): NEXUS electric blue
      ColorRule = RGBA(213, 220, 236, 1);
      ColorMuted = RGBA(78, 88, 118, 1);
      ColorExcused = RGBA(46, 125, 50, 1);   // green = excused absence
      ColorUnexcused = RGBA(183, 28, 28, 1); // red = unexcused absence
      ColorNonSchool = RGBA(220, 225, 237, 1);
      ColorNotEnrolled = RGBA(235, 239, 247, 1);
      ColorSaving = RGBA(228, 236, 254, 1);
      ColorInfoBg = RGBA(226, 232, 255, 1);
      ColorWarnBg = RGBA(252, 240, 220, 1);
      ColorErrorBg = RGBA(250, 228, 228, 1);
      ColorViolet = RGBA(124, 58, 237, 1);   // NEXUS violet: Help (NEXUS) panel
      ColorCyan = RGBA(34, 211, 238, 1);     // NEXUS cyan: highlights on navy only (too light for text on white)
      // ---------- Student management (build 2) ----------
      CanManageStudents = IsOfficeRole || IsAdminRole;
      StudentCampusLock = If(IsOfficeRole && !IsBlank(CurrentStaff.Campus), CurrentStaff.Campus.Campus, ZeroGuid);
      StudentDefaultScope = If(!StaffReady || IsBlank(CurrentStaff.Campus), ZeroGuid, CurrentStaff.Campus.Campus);
      ActiveService = First(Filter(Services, Active = true));
      // ---------- Month / year pickers (Attendance toolbar) ----------
      MonthOptions = ForAll(Sequence(12), {MonthNum: Value, MonthName: Text(Date(2000, Value, 1), "mmmm")});
      FirstSchoolYear = Coalesce(Year(First(Sort('School Years', 'Start Date', SortOrder.Ascending)).'Start Date'), Year(Today()));
      // ---------- Absence classification (build 3) ----------
      CanClassify = IsOfficeRole || IsAdminRole;
      CurrentSchoolYear = LookUp('School Years', 'Start Date' <= Today() && 'End Date' >= Today());
      // ---------- Parent-report approval (build 5) ----------
      ParentReportCutover = With({v: Trim(Coalesce(LookUp('App Settings', Key = "ParentReportCutoverDate").Value, ""))}, If(Len(v) = 10, IfError(Date(Value(Left(v, 4)), Value(Mid(v, 6, 2)), Value(Mid(v, 9, 2))), Date(2026, 1, 1)), Date(2026, 1, 1)));
      // ---------- Transportation (build 9) ----------
      TransportStatusOptions = ["Round trip", "Drop off only", "Pick up only", "No transportation"];
      TransportPatternOptions = ["Round trip", "Drop off only", "Pick up only"];
      // ---------- Staff (build 10) ----------
      StaffPending = IsBlank(CurrentStaff) && !IsBlank(LookUp(Staff, Email = Lower(User().Email) && Active = true));
      StaffRoleOptions = ["Teacher", "Attendance Office", "Read-only", "System Admin"];
      // ---------- NEXUS help panel (build 11) ----------
      NexusLogo = "data:image/png;base64,";
      HelpContextPrefix = "[AACA Attendance app help request. The user's role in the app is " & RoleLabel & ". Answer about the AACA Attendance app using the AACA Attendance App User Guide. Keep answers short and step-by-step.]";
      // ---------- Calendar (build 13) ----------
      CalRsy = RGBA(21, 128, 61, 1);         // First / Last Day RSY; Make-up outline
      CalEsy = RGBA(29, 78, 216, 1);         // First / Last Day ESY
      CalNoSchool = RGBA(17, 17, 17, 1);     // Holiday, Break, Closed
      CalSdd = RGBA(112, 48, 160, 1);        // Staff Development (Work Only)
      CalTesting = RGBA(245, 158, 11, 1);    // Testing start / end (ink text)
      CalWeather = RGBA(185, 28, 28, 1);     // Inclement Weather
      CalNonTerm = RGBA(217, 217, 217, 1);   // weekday outside every quarter / ESY
      CalMonthBand = RGBA(31, 56, 100, 1);   // month title band
      CalTypeOptions = Table({Value: "Holiday", Show: "No school - Holiday"}, {Value: "Break", Show: "No school - Break"}, {Value: "Closed", Show: "No school - Closed"}, {Value: "Work Only", Show: "Staff Development (no students)"}, {Value: "Inclement Weather", Show: "Inclement Weather (closed)"}, {Value: "Make-up School Day", Show: "Make-up School Day"}, {Value: "Clear", Show: "Clear (remove the entry)"});
      CalRsyTarget = Coalesce(IfError(Value(LookUp('App Settings', Key = "CalRsyTargetDays").Value), Blank()), 180);   // RSY student days required
      CalEsyTarget = Coalesce(IfError(Value(LookUp('App Settings', Key = "CalEsyTargetDays").Value), Blank()), 29);    // ESY student days required
      CalLegend = Table({Kind: "rsy", Txt: "First / Last Day RSY"}, {Kind: "esy", Txt: "First / Last Day ESY"}, {Kind: "noschool", Txt: "No School / Work"}, {Kind: "sdd", Txt: "Staff Development"}, {Kind: "test", Txt: "Testing start / end"}, {Kind: "weather", Txt: "Inclement Weather"}, {Kind: "makeup", Txt: "Make-up School Day"}, {Kind: "nonterm", Txt: "Not in a quarter"});
    OnStart: |-
      =Set(varMonthStart, Date(Year(Today()), Month(Today()), 1));
      Set(varMonthEnd, DateAdd(DateAdd(Date(Year(Today()), Month(Today()), 1), 1, TimeUnit.Months), -1, TimeUnit.Days));
      Set(varViewDate, Today());
      Set(
          varCampus,
          If(
              IsBlank(CurrentStaff.Campus),
              First(Sort(Campuses, Name, SortOrder.Ascending)),
              CurrentStaff.Campus
          )
      );
      Set(
          varTeacher,
          If(
              IsTeacherRole,
              CurrentStaff,
              First(
                  Sort(
                      Filter(Staff, Campus.Campus = varCampus.Campus && 'App Role' = 'App Role (Staff)'.Teacher && Active = true),
                      Name,
                      SortOrder.Ascending
                  )
              )
          )
      );
      Set(varCanEditMonth, false);
      Set(varLoading, false);
      Set(varLoadError, "");
      Set(varDetailsMode, false);
      Set(varDetailOpen, false);
      Set(varConfirmOpen, false);
      Set(varBulkDay, 0);
      Set(varSaveReq, {StudentId: ZeroGuid, DayNum: 0, Target: ""});
      Set(varClearKey, {StudentId: ZeroGuid, DayNum: 0});
      Set(varDetailKey, {StudentId: ZeroGuid, DayNum: 0});
      Set(varLastAction, {Kind: "", Message: "", StudentId: ZeroGuid, DayNum: 0});
      ClearCollect(colCellState, {StudentId: ZeroGuid, DayNum: 0, SaveState: "", Target: ""});
      Clear(colCellState);
      ClearCollect(colBulkLog, {StudentId: ZeroGuid, Outcome: ""});
      Clear(colBulkLog);
      Set(varStuSelId, ZeroGuid);
      Set(varStuSelId, Blank());
      Set(varStuMode, "");
      Set(varStuSaving, false);
      Set(varStuLoading, false);
      Set(varStuLoadError, "");
      Set(varStuAttAfter, 0);
      Set(varStuFormCampusId, ZeroGuid);
      Set(varStuScopeCampusId, StudentDefaultScope);
      Set(varStuTeacherFilterId, ZeroGuid);
      Set(varStuReceipt, {Kind: "", Title: "", StudentId: ZeroGuid});
      ClearCollect(colStuReceiptLines, {Label: "", Value: ""});
      Clear(colStuReceiptLines);
      Set(varAbsCampusId, If(StudentCampusLock <> ZeroGuid, StudentCampusLock, !IsBlank(CurrentStaff.Campus), CurrentStaff.Campus.Campus, Coalesce(First(Sort(Campuses, Name, SortOrder.Ascending)).Campus, ZeroGuid)));
      Set(varAbsTeacherId, ZeroGuid);
      Set(varAbsStatus, "Not classified");
      Set(varAbsFrom, ParentReportCutover);
      Set(varAbsTo, DateAdd(Today(), 90, TimeUnit.Days));
      Set(varAbsLoading, false);
      Set(varAbsSaving, false);
      Set(varAbsLoadError, "");
      Set(varAbsSelId, ZeroGuid);
      Set(varAbsSelId, Blank());
      Set(varAbsReasonId, ZeroGuid);
      Set(varAbsReasonId, Blank());
      Set(varAbsBulkReasonId, ZeroGuid);
      Set(varAbsBulkReasonId, Blank());
      Set(varAbsReq, {Kind: "", Scope: "", ReasonId: ZeroGuid});
      Set(varAbsReceipt, {Kind: "", Title: ""});
      ClearCollect(colAbsTicked, {AttId: ZeroGuid});
      Clear(colAbsTicked);
      ClearCollect(colAbsWork, {AttId: ZeroGuid});
      Clear(colAbsWork);
      ClearCollect(colAbsLog, {AttId: ZeroGuid, StudentName: "", AbsDate: Today(), TeacherName: "", CampusName: "", OldClass: "", NewClass: "", ReasonName: "", ByName: "", OnText: "", Outcome: "", AuditOk: false});
      Clear(colAbsLog);
      ClearCollect(colAbsReceiptLines, {Label: "", Value: ""});
      Clear(colAbsReceiptLines);
      Set(varAbsView, "classify");
      Set(varAbsMeLoading, false);
      Set(varAbsMeLoaded, false);
      Set(varAbsMeSaving, false);
      Set(varAbsMeLoadError, "");
      Set(varAbsMeErr, "");
      Set(varAbsMeCampusId, ZeroGuid);
      Set(varAbsMeSelId, 0);
      Set(varAbsMeSelId, Blank());
      Set(varAbsMeMode, "");
      Set(varAbsMeReceipt, {Kind: "", Title: "", Body: ""});
      Set(varAbsAddMode, "");
      Set(varAbsAddClass, "");
      Set(varAbsAddReasonId, ZeroGuid);
      Set(varAbsAddReasonId, Blank());
      Set(varAbsAddErr, "");
      Set(varTrnView, "daily");
      Set(varTrnCampusId, If(StudentCampusLock <> ZeroGuid, StudentCampusLock, !IsBlank(CurrentStaff.Campus), CurrentStaff.Campus.Campus, Coalesce(First(Sort(Campuses, Name, SortOrder.Ascending)).Campus, ZeroGuid)));
      Set(varTrnDate, Today());
      Set(varTrnIsSchoolDay, false);
      Set(varTrnDayReason, "");
      Set(varTrnLoading, false);
      Set(varTrnSaving, false);
      Set(varTrnLoadError, "");
      Set(varTrnShowEnded, false);
      Set(varTrnStuMode, "");
      Set(varTrnSelStId, ZeroGuid);
      Set(varTrnSelStId, Blank());
      Set(varTrnReq, {Scope: ""});
      Set(varTrnReceipt, {Kind: "", Title: ""});
      ClearCollect(colTrnReceiptLines, {Label: "", Value: ""});
      Clear(colTrnReceiptLines);
      ClearCollect(colTrnWork, {StudentId: ZeroGuid, Status: ""});
      Clear(colTrnWork);
      ClearCollect(colTrnLog, {StudentName: "", Before: "", Status: "", ByName: "", OnText: "", LogKey: "", Outcome: "", AuditOk: false});
      Clear(colTrnLog);
      Set(varStfCampusId, If(StudentCampusLock <> ZeroGuid, StudentCampusLock, !IsBlank(CurrentStaff.Campus), CurrentStaff.Campus.Campus, Coalesce(First(Sort(Campuses, Name, SortOrder.Ascending)).Campus, ZeroGuid)));
      Set(varStfSelId, ZeroGuid);
      Set(varStfSelId, Blank());
      Set(varStfMode, "");
      Set(varStfShowRetired, false);
      Set(varStfLoading, false);
      Set(varStfSaving, false);
      Set(varStfLoadError, "");
      Set(varStfXferDate, Today());
      Set(varStfReceipt, {Kind: "", Title: ""});
      ClearCollect(colStfCampusOpts, {CampusId: ZeroGuid, CampusName: ""});
      Clear(colStfCampusOpts);
      ClearCollect(colStfAll, {StaffId: ZeroGuid, StaffName: "", Email: "", RoleText: "", CampusId: ZeroGuid, CampusName: "", StartDate: Today(), EndDate: Today(), IsActive: false, Linked: false, StudentsNow: 0, SearchKey: ""});
      Clear(colStfAll);
      ClearCollect(colStfEmails, {StaffId: ZeroGuid, StaffName: "", EmailL: "", UserEmailL: ""});
      Clear(colStfEmails);
      ClearCollect(colStfEnr, {EnrId: ZeroGuid, TeacherId: ZeroGuid});
      Clear(colStfEnr);
      ClearCollect(colStfLocks, {MonthStart: Today()});
      Clear(colStfLocks);
      ClearCollect(colStfXferEnr, {EnrId: ZeroGuid, StudentId: ZeroGuid, StudentName: "", StudentNumber: "", StudentStatus: "", ServiceId: ZeroGuid, RatioText: "", StartDate: Today(), EndDate: Today(), YearEnd: Today()});
      Clear(colStfXferEnr);
      ClearCollect(colStfPlan, {EnrId: ZeroGuid, StudentId: ZeroGuid, StudentName: "", StudentNumber: "", RatioText: "", StartDate: Today(), Action: "", Reason: ""});
      Clear(colStfPlan);
      ClearCollect(colStfXferWork, {EnrId: ZeroGuid, StudentId: ZeroGuid, StudentName: "", StudentNumber: "", RatioText: "", StartDate: Today(), Action: "", Reason: ""});
      Clear(colStfXferWork);
      ClearCollect(colStfLog, {EnrId: ZeroGuid, StudentName: "", StudentNumber: "", Action: "", Outcome: "", Detail: "", NewEnrId: ZeroGuid, AuditOk: false});
      Clear(colStfLog);
      ClearCollect(colStfReceiptLines, {Label: "", Value: ""});
      Clear(colStfReceiptLines);
      Set(varHelpOpen, false);
      Set(varHelpBusy, false);
      Set(varHelpConvId, "");
      ClearCollect(colHelpMsgs, {N: 0, Q: "", A: ""});
      Clear(colHelpMsgs);
      Set(varAbsNtSelId, ZeroGuid);
      Set(varAbsNtSelId, Blank());
      Set(varAbsNtAllStu, false);
      Set(varAbsNtHow, "");
      Set(varAbsNtOpenAt, Now());
      Set(varAbsNtErr, "");
      Set(varAttQtrYear, CurrentSchoolYear);
      Set(varAttQtrSel, {StudentId: ZeroGuid, Term: ""});
      Set(varAttQtrLoading, false);
      Set(varAttQtrError, "");
      Set(varCalYearId, Coalesce(CurrentSchoolYear.'School Year', ZeroGuid));
      Set(varCalCampusId, If(!IsBlank(CurrentStaff.Campus), CurrentStaff.Campus.Campus, Coalesce(First(Sort(Campuses, Name, SortOrder.Ascending)).Campus, ZeroGuid)));
      Set(varCalLoading, false);
      Set(varCalSaving, false);
      Set(varCalLoadError, "");
      Set(varCalPanel, "Days");
      Set(varCalFrom, Today());
      Set(varCalFrom, Blank());
      Set(varCalTo, Today());
      Set(varCalTo, Blank());
      Set(varCalPickTo, false);
      Set(varCalDayAtt, {Key: "", N: 0});
      Set(varCalCopyTargetId, ZeroGuid);
      Set(varCalCopyTargetId, Blank());
      Set(varCalReceipt, {Kind: "", Title: ""});
      Set(varCalCheckWithAtt, false);
      Set(varCalCheckStamp, "");
      ClearCollect(colCalYearOpts, {YearId: ZeroGuid, YearName: "", S: Today(), E: Today(), StatusText: ""});
      Clear(colCalYearOpts);
      ClearCollect(colCalCampusOpts, {CampusId: ZeroGuid, CampusName: "", Code: ""});
      Clear(colCalCampusOpts);
      ClearCollect(colCalTermsAll, {TermId: ZeroGuid, TermText: "", S: Today(), E: Today(), CampusId: ZeroGuid, Name: ""});
      Clear(colCalTermsAll);
      ClearCollect(colCalExcAll, {ExcId: ZeroGuid, D: Today(), Label: "", TypeText: "", CampusId: ZeroGuid});
      Clear(colCalExcAll);
      ClearCollect(colCalLocksAll, {CampusId: ZeroGuid, MonthStart: Today()});
      Clear(colCalLocksAll);
      ClearCollect(colCalTermsEff, {TermText: "", S: Today(), E: Today(), TermId: ZeroGuid, IsCampus: false, Has: false});
      Clear(colCalTermsEff);
      ClearCollect(colCalExcEff, {ExcId: ZeroGuid, D: Today(), Label: "", TypeText: "", IsCampus: false});
      Clear(colCalExcEff);
      ClearCollect(colCalYearDays, {D: Today(), Open: false});
      Clear(colCalYearDays);
      ClearCollect(colCalMonths, {MonthKey: 0, MonthStart: Today(), Title: "", Locked: false});
      Clear(colCalMonths);
      ClearCollect(colCalCells, {MonthKey: 0, Idx: 0, D: Today(), IsHdr: false, InMonth: false, Txt: "", Kind: "", Label: "", Tip: ""});
      Clear(colCalCells);
      ClearCollect(colCalExcFlag, {D: Today(), Label: "", IsStart: false, IsEnd: false});
      Clear(colCalExcFlag);
      ClearCollect(colCalImportant, {Sec: 0, SortD: Today(), IsHead: false, Line: "", Keep: false});
      Clear(colCalImportant);
      ClearCollect(colCalChecks, {Sev: "", Line: ""});
      Clear(colCalChecks);
      ClearCollect(colCalAlso, {CampusId: ZeroGuid, CampusName: "", Ticked: false});
      Clear(colCalAlso);
      ClearCollect(colCalTargets, {CampusId: ZeroGuid, CampusName: "", Code: ""});
      Clear(colCalTargets);
      ClearCollect(colCalPerEdit, {N: 0, TermText: "", S: Today(), E: Today()});
      Clear(colCalPerEdit);
      ClearCollect(colCalDayWork, {D: Today(), CampusId: ZeroGuid, CampusName: ""});
      Clear(colCalDayWork);
      ClearCollect(colCalLog, {Key: "", Outcome: "", Detail: "", Id: ZeroGuid});
      Clear(colCalLog);
      ClearCollect(colCalCopyNew, {Key: "", Outcome: "", Detail: "", Id: ZeroGuid});
      Clear(colCalCopyNew);
      ClearCollect(colCalCopyOld, {Kind: "", Id: ZeroGuid, Txt: "", Ms: Today()});
      Clear(colCalCopyOld);
      ClearCollect(colCalFed, {D: Today(), Label: ""});
      Clear(colCalFed);
      ClearCollect(colCalTplTerms, {TermText: "", S: Today(), E: Today()});
      Clear(colCalTplTerms);
      ClearCollect(colCalTplExc, {D: Today(), Label: "", TypeText: "", Fed: false});
      Clear(colCalTplExc);
      ClearCollect(colCalReceiptLines, {Label: "", Value: ""});
      Clear(colCalReceiptLines)
    StartScreen: =If(Lower(Coalesce(Param("screen"), "")) = "absences" && CanClassify, AbsencesScreen, Screen1)
    Theme: =PowerAppsTheme
