Screens:
  StaffScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =Set(varStfSaving, false);
        Set(varStfLoading, false);
        Set(varStfMode, "");
        Set(varStfSelId, Blank());
        Set(varStfReceipt, {Kind: "", Title: ""});
        Clear(colStfReceiptLines);
        Clear(colStfPlan);
        If(StudentCampusLock <> ZeroGuid, Set(varStfCampusId, StudentCampusLock));
        ClearCollect(colStfCampusOpts, ForAll(Sort(Campuses, Name, SortOrder.Ascending) As c, {CampusId: c.Campus, CampusName: c.Name}));
        If(varStfCampusId = ZeroGuid, Set(varStfCampusId, Coalesce(First(colStfCampusOpts).CampusId, ZeroGuid)));
        Select(btnStfLoadEngine)
    Children:
      - conStfRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conStfHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conStfRoot.Width < 640, 92, 76) + If(CanManageStudents, If(conStfRoot.Width < 640, 152, 48), 48) + If(CanManageStudents, 60, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(CanManageStudents, 0, 12)
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblStfTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Attendance"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Attendance"
                        Wrap: =false
                  - lblStfIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conStfRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =0
                        Size: =12
                        Text: =Coalesce(CurrentUserRow.'Full Name', User().FullName) & " · " & RoleLabel & " · " & If(!StaffReady, "no campus", IsBlank(CurrentStaff.Campus), "All campuses", CurrentStaff.Campus.Name)
                        VerticalAlign: =VerticalAlign.Top
                  - conStfNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(CanManageStudents, If(conStfRoot.Width < 640, 148, 44) + 8, 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingLeft: =16
                        PaddingRight: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnStfNavAttendance:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Attendance"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(Screen1)
                              Size: =14
                              Text: ="Attendance"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnStfNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnStfNavAbsences:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Absences"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(AbsencesScreen)
                              Size: =14
                              Text: ="Absences"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnStfNavTransport:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Transportation"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(TransportScreen)
                              Size: =14
                              Text: ="Transportation"
                              Visible: =CanClassify
                              Width: =140
                        - btnStfNavStaff:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Staff (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StaffScreen)
                              Size: =14
                              Text: ="Staff"
                              Visible: =CanManageStudents
                              Width: =80
                        - conStfNavSpacer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =conStfRoot.Width >= 640
                        - imgStfNavHelp:
                            Control: Image
                            Properties:
                              AccessibleLabel: =If(varHelpOpen, "Close NEXUS help", "Open NEXUS help")
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =ColorViolet
                              BorderThickness: =If(varHelpOpen, 3, 0)
                              FocusedBorderThickness: =3
                              Height: =44
                              HoverBorderColor: =ColorCyan
                              Image: =NexusLogo
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varHelpOpen, !varHelpOpen)
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              TabIndex: =0
                              Tooltip: =If(varHelpOpen, "Close NEXUS help", "Ask NEXUS for help")
                              Width: =44
                  - conStfHdrBar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorPaper
                        FillPortions: =0
                        Height: =60
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =CanManageStudents
                      Children:
                        - lblStfCampus:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Campus"
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorMuted
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Campus"
                              Width: =56
                              Wrap: =false
                        - ddStfCampus:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Campus"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              Color: =ColorInk
                              Default: =LookUp(colStfCampusOpts, CampusId = varStfCampusId)
                              DisplayMode: =If(StudentCampusLock = ZeroGuid && !varStfLoading && !varStfSaving, DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =36
                              ItemDisplayText: =ThisItem.CampusName
                              Items: =colStfCampusOpts
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: |-
                                =Set(varStfCampusId, Coalesce(Self.Selected.CampusId, ZeroGuid));
                                Set(varStfMode, "");
                                Set(varStfSelId, Blank());
                                Clear(colStfPlan);
                                Select(btnStfLoadEngine)
                              Width: =220
            - conStfHelp:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorViolet
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =If(conStfRoot.Width < 640, 460, 400)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varHelpOpen
                Children:
                  - conStfHelpHead:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblStfHelpTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorViolet
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="NEXUS · AACA Attendance help"
                              Wrap: =false
                        - btnStfHelpNew:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Start a new conversation with NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              DisplayMode: =If(varHelpBusy, DisplayMode.Disabled, DisplayMode.Edit)
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Clear(colHelpMsgs); Set(varHelpConvId, "")
                              Size: =13
                              Text: ="New conversation"
                              Width: =150
                        - btnStfHelpClose:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Close NEXUS help"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varHelpOpen, false)
                              Size: =13
                              Text: ="Close"
                              Width: =80
                  - spnStfHelpBusy:
                      Control: Spinner
                      Properties:
                        AccessibleLabel: ="NEXUS is looking up your answer"
                        AlignInContainer: =AlignInContainer.Stretch
                        FontColor: =ColorInk
                        FontSize: =13
                        Height: =32
                        Label: ="NEXUS is looking that up... answers usually take 10-30 seconds."
                        LabelPosition: ='Spinner.LabelPosition'.After
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SpinnerColor: =ColorViolet
                        SpinnerSize: ='Spinner.SpinnerSize'.Small
                        TrackColor: =ColorInfoBg
                        Visible: =varHelpBusy
                  - conStfHelpChat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorPaper
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                      Children:
                        - htmStfHelpChat:
                            Control: HtmlViewer
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =ColorInk
                              HtmlText: |-
                                =If(CountRows(colHelpMsgs) = 0, "<div style='color:#4E5876;padding:4px'>Hi, I am <b style='color:#7C3AED'>NEXUS</b>. Ask me how to do something in the AACA Attendance app, or what a button, mark or color means. For example: <i>How do I classify an absence?</i> or <i>What does 1* mean?</i></div>", Concat(Sort(colHelpMsgs, N, SortOrder.Descending), "<div style='margin:4px 0 4px 48px;padding:8px 12px;background:#2563EB;color:#FFFFFF;border-radius:12px 12px 2px 12px'>" & Substitute(Substitute(Substitute(Substitute(Substitute(Q, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), "**", ""), Char(10), "<br>") & "</div>" & If(A = "", "<div style='margin:4px 48px 14px 0;padding:8px 12px;color:#4E5876'><i>NEXUS is thinking...</i></div>", "<div style='margin:4px 48px 14px 0;padding:8px 12px;background:#FFFFFF;border:1px solid #D5DCEC;border-left:4px solid #7C3AED;color:#0F163A;border-radius:12px 12px 12px 2px'><b style='color:#7C3AED'>NEXUS</b><br>" & Substitute(Substitute(Substitute(Substitute(Substitute(A, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), "**", ""), Char(10), "<br>") & "</div>")))
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                  - conStfHelpAsk:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtStfHelpQ:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Your question for NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              Color: =ColorInk
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              MaxLength: =500
                              Placeholder: ="Ask how to do something in the app..."
                        - btnStfHelpAsk:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Send the question to NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorViolet
                              Color: =ColorWhite
                              DisplayMode: =If(varHelpBusy || Trim(txtStfHelpQ.Text) = "", DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =40
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With({q: Trim(txtStfHelpQ.Text), n: CountRows(colHelpMsgs) + 1},
                                    If(q <> "" && !varHelpBusy,
                                        Set(varHelpBusy, true);
                                        Collect(colHelpMsgs, {N: n, Q: q, A: ""});
                                        Reset(txtStfHelpQ);
                                        With({r: IfError('AACA-AskNEXUS'.Run(q, {ConversationId: Coalesce(varHelpConvId, ""), Context: HelpContextPrefix & " The user is on the Staff screen."}), {answer: "NEXUS could not answer right now. Please try again in a moment.", conversationid: Coalesce(varHelpConvId, ""), ok: "false"})},
                                            Patch(colHelpMsgs, LookUp(colHelpMsgs, N = n), {A: Coalesce(r.answer, "NEXUS did not return an answer. Please try again.")});
                                            If(r.ok = "true" && !IsBlank(r.conversationid), Set(varHelpConvId, r.conversationid))
                                        );
                                        Set(varHelpBusy, false)
                                    )
                                )
                              Size: =14
                              Text: =If(varHelpBusy, "Asking...", "Ask")
                              Width: =100
                  - lblStfHelpNote:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorMuted
                        Height: =If(conStfRoot.Width < 640, 52, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="NEXUS answers from the AACA Resource Center and the Attendance user guide. Answers usually take 10-30 seconds. Check important details with your office."
                        VerticalAlign: =VerticalAlign.Top
            - conStfDenied:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + If(conStfRoot.Width < 640, 48, 24) + 8 + If(conStfRoot.Width < 640, 112, 48) + 8 + 44 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!CanManageStudents
                Children:
                  - lblStfDeniedTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Staff is not available for your role"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =If(conStfRoot.Width < 640, 48, 24)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Staff is not available for your role"
                        VerticalAlign: =VerticalAlign.Top
                  - lblStfDeniedBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =If(conStfRoot.Width < 640, 112, 48)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask your office manager to add you on the Staff screen.", "Only the Attendance Office and System Admin roles manage staff. Teachers and Read-only users record and view attendance on the Attendance screen.")
                        VerticalAlign: =VerticalAlign.Top
                  - btnStfDeniedBack:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Back to Attendance"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Secondary
                        Color: =ColorInk
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Screen1)
                        Size: =14
                        Text: ="Back to Attendance"
                        Width: =190
            - conStfBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(conStfReceipt.Visible, conStfReceipt.Height + 8, 0) + conStfView.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =CanManageStudents
                Children:
                  - conStfReceipt:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =ColorRule
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =Switch(varStfReceipt.Kind, "Failed", ColorErrorBg, "Blocked", ColorErrorBg, "Partial", ColorWarnBg, ColorInfoBg)
                        FillPortions: =0
                        Height: =8 + If(conStfRoot.Width < 640, 124, 64) + If(CountRows(colStfReceiptLines) > 0, 4 + galStfReceipt.Height, 0) + 8
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =varStfReceipt.Kind <> ""
                      Children:
                        - conStfReceiptTop:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(conStfRoot.Width < 640, 124, 64)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblStfReceiptTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =varStfReceipt.Title
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorInk
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(conStfRoot.Width < 640, 124, 64)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =varStfReceipt.Title
                                    VerticalAlign: =VerticalAlign.Top
                              - btnStfReceiptClose:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Close result"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varStfReceipt, {Kind: "", Title: ""}); Clear(colStfReceiptLines)
                                    Size: =14
                                    Text: ="Close"
                                    Width: =88
                        - galStfReceipt:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Staff result details"
                              FillPortions: =0
                              Height: =Min(560, RoundUp(CountRows(colStfReceiptLines) / If(conStfRoot.Width < 1024, 1, 2), 0) * If(conStfRoot.Width < 640, 88, 56))
                              Items: =colStfReceiptLines
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Selectable: =false
                              TabIndex: =0
                              TemplatePadding: =0
                              TemplateSize: =If(conStfRoot.Width < 640, 88, 56)
                              Visible: =CountRows(colStfReceiptLines) > 0
                              WrapCount: =If(conStfRoot.Width < 1024, 1, 2)
                            Children:
                              - conStfRcptRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingBottom: =2
                                    PaddingRight: =8
                                    PaddingTop: =2
                                    Width: =Parent.TemplateWidth - 16
                                  Children:
                                    - lblStfRcptLabel:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =ThisItem.Label
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorMuted
                                          FontWeight: =FontWeight.Semibold
                                          Height: =Parent.Height - 4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
