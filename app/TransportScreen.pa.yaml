                                          Appearance: =ButtonAppearance.Secondary
                                          Color: =ColorInk
                                          Height: =44
                                          Layout: =ButtonLayout.TextOnly
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varTrnStuMode, ""); Set(varTrnSelStId, Blank()); Reset(cboTrnStuPick); Reset(txtTrnStuNote)
                                          Size: =14
