Screens:
  TransportScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =Set(varTrnSaving, false);
        Set(varTrnLoading, false);
        Set(varTrnStuMode, "");
        Set(varTrnSelStId, Blank());
        Set(varTrnReceipt, {Kind: "", Title: ""});
        Clear(colTrnReceiptLines);
        If(varTrnView <> "students", Set(varTrnView, "daily"));
        If(StudentCampusLock <> ZeroGuid, Set(varTrnCampusId, StudentCampusLock));
        Set(varTrnDate, Today());
        ClearCollect(colTrnCampusOpts, ForAll(Sort(Campuses, Name, SortOrder.Ascending) As c, {CampusId: c.Campus, CampusName: c.Name}));
        If(varTrnCampusId = ZeroGuid, Set(varTrnCampusId, Coalesce(First(colTrnCampusOpts).CampusId, ZeroGuid)));
        Select(btnTrnStuLoadEngine);
        Select(btnTrnLoadEngine);
        Select(btnTrnBannerEngine)
    Children:
      - conTrnRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conTrnHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conTrnRoot.Width < 640, 92, 76) + If(CanManageStudents, If(conTrnRoot.Width < 640, 152, conTrnRoot.Width < 800, 100, 48), 48) + If(CanClassify, If(conTrnRoot.Width < 640, 112, 60), 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(CanClassify, 0, 12)
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblTrnTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Attendance"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Attendance"
                        Wrap: =false
                  - lblTrnIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conTrnRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =0
                        Size: =12
                        Text: =Coalesce(CurrentUserRow.'Full Name', User().FullName) & " · " & RoleLabel & " · " & If(!StaffReady, "no campus", IsBlank(CurrentStaff.Campus), "All campuses", CurrentStaff.Campus.Name)
                        VerticalAlign: =VerticalAlign.Top
                  - conTrnNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(CanManageStudents, If(conTrnRoot.Width < 640, 148, conTrnRoot.Width < 800, 96, 44) + If(CanClassify, 8, 0), 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingLeft: =16
                        PaddingRight: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnTrnNavAttendance:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Attendance"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(Screen1)
                              Size: =14
                              Text: ="Attendance"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnTrnNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnTrnNavAbsences:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Absences"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(AbsencesScreen)
                              Size: =14
                              Text: ="Absences"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnTrnNavTransport:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Transportation (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(TransportScreen)
                              Size: =14
                              Text: ="Transportation"
                              Visible: =CanClassify
                              Width: =140
                        - btnTrnNavStaff:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Staff"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StaffScreen)
                              Size: =14
                              Text: ="Staff"
                              Visible: =CanManageStudents
                              Width: =80
                        - btnTrnNavCalendar:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Calendar"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(CalendarScreen)
                              Size: =14
                              Text: ="Calendar"
                              Visible: =IsAdminRole
                              Width: =100
                        - conTrnNavSpacer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =conTrnRoot.Width >= 640
                        - imgTrnNavHelp:
                            Control: Image
                            Properties:
                              AccessibleLabel: =If(varHelpOpen, "Close NEXUS help", "Open NEXUS help")
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =ColorViolet
                              BorderThickness: =If(varHelpOpen, 3, 0)
                              FocusedBorderThickness: =3
                              Height: =44
                              HoverBorderColor: =ColorCyan
                              Image: =NexusLogo
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varHelpOpen, !varHelpOpen)
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              TabIndex: =0
                              Tooltip: =If(varHelpOpen, "Close NEXUS help", "Ask NEXUS for help")
                              Width: =44
                  - conTrnHdrTabs:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorPaper
                        FillPortions: =0
                        Height: =If(conTrnRoot.Width < 640, 112, 60)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =CanClassify
                      Children:
                        - btnTrnHdrDaily:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Daily confirmation" & If(varTrnView = "daily", " (current view)", "")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =If(varTrnView = "daily", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =ColorTeal
                              Color: =If(varTrnView = "daily", ColorWhite, ColorInk)
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTrnView, "daily"); Select(btnTrnLoadEngine); Select(btnTrnBannerEngine)
                              Size: =14
                              Text: ="Daily"
                              Width: =130
                        - btnTrnHdrStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Students with transportation" & If(varTrnView = "students", " (current view)", "")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =If(varTrnView = "students", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =ColorTeal
                              Color: =If(varTrnView = "students", ColorWhite, ColorInk)
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTrnView, "students")
                              Size: =14
                              Text: ="Students"
                              Width: =130
                        - lblTrnCampus:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Campus"
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorMuted
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Campus"
                              Width: =56
                              Wrap: =false
                        - ddTrnCampus:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Campus"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              Color: =ColorInk
                              Default: =LookUp(colTrnCampusOpts, CampusId = varTrnCampusId)
                              DisplayMode: =If(StudentCampusLock = ZeroGuid && !varTrnLoading && !varTrnSaving, DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =36
                              ItemDisplayText: =ThisItem.CampusName
                              Items: =colTrnCampusOpts
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: |-
                                =Set(varTrnCampusId, Coalesce(Self.Selected.CampusId, ZeroGuid));
                                Set(varTrnStuMode, "");
                                Set(varTrnSelStId, Blank());
                                Select(btnTrnStuLoadEngine);
                                Select(btnTrnLoadEngine);
                                Select(btnTrnBannerEngine)
                              Width: =220
            - conTrnHelp:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorViolet
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =If(conTrnRoot.Width < 640, 460, 400)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varHelpOpen
                Children:
                  - conTrnHelpHead:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblTrnHelpTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorViolet
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="NEXUS · AACA Attendance help"
                              Wrap: =false
                        - btnTrnHelpNew:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Start a new conversation with NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              DisplayMode: =If(varHelpBusy, DisplayMode.Disabled, DisplayMode.Edit)
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Clear(colHelpMsgs); Set(varHelpConvId, "")
                              Size: =13
                              Text: ="New conversation"
                              Width: =150
                        - btnTrnHelpClose:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Close NEXUS help"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varHelpOpen, false)
                              Size: =13
                              Text: ="Close"
                              Width: =80
                  - spnTrnHelpBusy:
                      Control: Spinner
                      Properties:
                        AccessibleLabel: ="NEXUS is looking up your answer"
                        AlignInContainer: =AlignInContainer.Stretch
                        FontColor: =ColorInk
                        FontSize: =13
                        Height: =32
                        Label: ="NEXUS is looking that up... answers usually take 10-30 seconds."
                        LabelPosition: ='Spinner.LabelPosition'.After
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SpinnerColor: =ColorViolet
                        SpinnerSize: ='Spinner.SpinnerSize'.Small
                        TrackColor: =ColorInfoBg
                        Visible: =varHelpBusy
                  - conTrnHelpChat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorPaper
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                      Children:
                        - htmTrnHelpChat:
                            Control: HtmlViewer
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =ColorInk
                              HtmlText: |-
                                =If(CountRows(colHelpMsgs) = 0, "<div style='color:#4E5876;padding:4px'>Hi, I am <b style='color:#7C3AED'>NEXUS</b>. Ask me how to do something in the AACA Attendance app, or what a button, mark or color means. For example: <i>How do I classify an absence?</i> or <i>What does 1* mean?</i></div>", Concat(Sort(colHelpMsgs, N, SortOrder.Descending), "<div style='margin:4px 0 4px 48px;padding:8px 12px;background:#2563EB;color:#FFFFFF;border-radius:12px 12px 2px 12px'>" & Substitute(Substitute(Substitute(Substitute(Substitute(Q, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), "**", ""), Char(10), "<br>") & "</div>" & If(A = "", "<div style='margin:4px 48px 14px 0;padding:8px 12px;color:#4E5876'><i>NEXUS is thinking...</i></div>", "<div style='margin:4px 48px 14px 0;padding:8px 12px;background:#FFFFFF;border:1px solid #D5DCEC;border-left:4px solid #7C3AED;color:#0F163A;border-radius:12px 12px 12px 2px'><b style='color:#7C3AED'>NEXUS</b><br>" & Substitute(Substitute(Substitute(Substitute(Substitute(A, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), "**", ""), Char(10), "<br>") & "</div>")))
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                  - conTrnHelpAsk:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtTrnHelpQ:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Your question for NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              Color: =ColorInk
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              MaxLength: =500
                              Placeholder: ="Ask how to do something in the app..."
                        - btnTrnHelpAsk:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Send the question to NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorViolet
                              Color: =ColorWhite
                              DisplayMode: =If(varHelpBusy || Trim(txtTrnHelpQ.Text) = "", DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =40
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With({q: Trim(txtTrnHelpQ.Text), n: CountRows(colHelpMsgs) + 1},
                                    If(q <> "" && !varHelpBusy,
                                        Set(varHelpBusy, true);
                                        Collect(colHelpMsgs, {N: n, Q: q, A: ""});
                                        Reset(txtTrnHelpQ);
                                        With({r: IfError('AACA-AskNEXUS'.Run(q, {ConversationId: Coalesce(varHelpConvId, ""), Context: HelpContextPrefix & " The user is on the Transportation screen."}), {answer: "NEXUS could not answer right now. Please try again in a moment.", conversationid: Coalesce(varHelpConvId, ""), ok: "false"})},
                                            Patch(colHelpMsgs, LookUp(colHelpMsgs, N = n), {A: Coalesce(r.answer, "NEXUS did not return an answer. Please try again.")});
                                            If(r.ok = "true" && !IsBlank(r.conversationid), Set(varHelpConvId, r.conversationid))
                                        );
                                        Set(varHelpBusy, false)
                                    )
                                )
                              Size: =14
                              Text: =If(varHelpBusy, "Asking...", "Ask")
                              Width: =100
                  - lblTrnHelpNote:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorMuted
                        Height: =If(conTrnRoot.Width < 640, 52, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="NEXUS answers from the AACA Resource Center and the Attendance user guide. Answers usually take 10-30 seconds. Check important details with your office."
                        VerticalAlign: =VerticalAlign.Top
            - conTrnDenied:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + If(conTrnRoot.Width < 640, 48, 24) + 8 + If(conTrnRoot.Width < 640, 112, 48) + 8 + 44 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!CanClassify
                Children:
                  - lblTrnDeniedTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Transportation is not available for your role"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =If(conTrnRoot.Width < 640, 48, 24)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Transportation is not available for your role"
                        VerticalAlign: =VerticalAlign.Top
                  - lblTrnDeniedBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =If(conTrnRoot.Width < 640, 112, 48)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask a System Admin to set you up.", "Only the Attendance Office and System Admin roles manage transportation. Teachers and Read-only users record and view attendance on the Attendance screen.")
                        VerticalAlign: =VerticalAlign.Top
                  - btnTrnDeniedBack:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Back to Attendance"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Secondary
                        Color: =ColorInk
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Screen1)
                        Size: =14
                        Text: ="Back to Attendance"
                        Width: =190
            - conTrnBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(conTrnReceipt.Visible, conTrnReceipt.Height + 8, 0) + If(conTrnDailyView.Visible, conTrnDailyView.Height, 0) + If(conTrnStuView.Visible, conTrnStuView.Height, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =CanClassify
                Children:
                  - conTrnReceipt:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =ColorRule
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =Switch(varTrnReceipt.Kind, "Failed", ColorErrorBg, "Blocked", ColorErrorBg, ColorInfoBg)
                        FillPortions: =0
                        Height: =8 + If(conTrnRoot.Width < 640, 84, 44) + If(CountRows(colTrnReceiptLines) > 0, 4 + galTrnReceipt.Height, 0) + 8
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =varTrnReceipt.Kind <> ""
                      Children:
                        - conTrnReceiptTop:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(conTrnRoot.Width < 640, 84, 44)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblTrnReceiptTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =varTrnReceipt.Title
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorInk
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(conTrnRoot.Width < 640, 84, 44)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
