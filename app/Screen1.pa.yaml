Screens:
  Screen1:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =// Self-heal on every visit: never leave the controls locked by an interrupted load, and never keep a
        // remembered campus/teacher that no longer exists (e.g. after a data reset).
        Set(varLoading, false);
        If(IsTeacherRole && !IsBlank(CurrentStaff.Campus), Set(varCampus, CurrentStaff.Campus));
        // Years offered by the year picker: first school year through next calendar year
        ClearCollect(colAttYears, ForAll(Sequence(Year(Today()) + 2 - FirstSchoolYear, FirstSchoolYear), {YearNum: Value}));
        With(
            {cid: varCampus.Campus},
            If(IsBlank(cid) || IsBlank(LookUp(Campuses, ThisRecord.Campus = cid)),
                Set(varCampus, If(IsBlank(CurrentStaff.Campus), First(Sort(Campuses, Name, SortOrder.Ascending)), CurrentStaff.Campus)))
        );
        With(
            {tid: varTeacher.Staff, cid: varCampus.Campus},
            If(
                IsTeacherRole, Set(varTeacher, CurrentStaff),
                IsBlank(tid) || IsBlank(LookUp(Staff, ThisRecord.Staff = tid && Campus.Campus = cid)),
                Set(varTeacher, First(Sort(Filter(Staff, Campus.Campus = cid && 'App Role' = 'App Role (Staff)'.Teacher), Name, SortOrder.Ascending)))
            )
        );
        Select(btnAttLoadEngine)
    Children:
      - conAttRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conAttHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conAttRoot.Width < 640, 92, 76) + If(CanManageStudents, If(conAttRoot.Width < 640, 100, 48), 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblAttTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Attendance"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Attendance"
                        Wrap: =false
                  - lblAttIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Signed in as " & Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conAttRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =Coalesce(CurrentUserRow.'Full Name', User().FullName) & " · " & RoleLabel & " · " & If(!StaffReady, "no campus", IsBlank(CurrentStaff.Campus), "All campuses", CurrentStaff.Campus.Name)
                  - conAttNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(conAttRoot.Width < 640, 96, 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =CanManageStudents
                      Children:
                        - btnAttNavAttendance:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Attendance (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(Screen1)
                              Size: =14
                              Text: ="Attendance"
                              Width: =110
                        - btnAttNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Width: =110
                        - btnAttNavAbsences:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Absences"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(AbsencesScreen)
                              Size: =14
                              Text: ="Absences"
                              Width: =110
                        - btnAttNavTransport:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Transportation"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(TransportScreen)
                              Size: =14
                              Text: ="Transportation"
                              Visible: =CanClassify
                              Width: =140
            - conAttNotSetUp:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =If(conAttRoot.Width < 640, 168, conAttRoot.Width < 1024, 128, 112)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!StaffReady
                Children:
                  - lblAttNotSetUpTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="You're not set up yet"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="You're not set up yet"
                        Wrap: =false
                  - lblAttNotSetUpBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =If(conAttRoot.Width < 640, 104, conAttRoot.Width < 1024, 64, 48)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Your sign-in (" & User().Email & ") is not linked to an active Staff record. Ask a System Admin to add a Staff row linked to your Users record, then reopen the app."
            - conAttToolbar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =140
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =StaffReady
                Children:
                  - conAttToolbarRow1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =58
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowX: =LayoutOverflow.Scroll
                      Children:
                        - conAttMonthBar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =ColorWhite
                              FillPortions: =0
                              Height: =58
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =514
                            Children:
                              - btnAttMonthPrev:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Previous month"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varMonthStart, DateAdd(varMonthStart, -1, TimeUnit.Months)); Select(btnAttLoadEngine)
                                    Size: =14
                                    Text: ="< Prev"
                                    Width: =72
                              - ddAttMonthPick:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Month"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Default: =LookUp(MonthOptions, MonthNum = Month(varMonthStart))
                                    DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    ItemDisplayText: =ThisItem.MonthName
                                    Items: =MonthOptions
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =// Jump straight to the chosen month (ignored when it already matches, e.g. after Prev/Next)
                                      If(
                                          !IsBlank(Self.Selected) && Self.Selected.MonthNum <> Month(varMonthStart),
                                          Set(varMonthStart, Date(Year(varMonthStart), Self.Selected.MonthNum, 1));
                                          Select(btnAttLoadEngine)
                                      )
                                    Width: =150
                              - ddAttYearPick:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Year"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Default: =LookUp(colAttYears, YearNum = Year(varMonthStart))
                                    DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    ItemDisplayText: =Text(ThisItem.YearNum)
                                    Items: =colAttYears
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =If(
                                          !IsBlank(Self.Selected) && Self.Selected.YearNum <> Year(varMonthStart),
                                          Set(varMonthStart, Date(Self.Selected.YearNum, Month(varMonthStart), 1));
                                          Select(btnAttLoadEngine)
                                      )
                                    Width: =100
                              - btnAttMonthNext:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Next month"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varMonthStart, DateAdd(varMonthStart, 1, TimeUnit.Months)); Select(btnAttLoadEngine)
                                    Size: =14
                                    Text: ="Next >"
                                    Width: =72
                              - btnAttMonthNow:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Go to this month"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varMonthStart, Date(Year(Today()), Month(Today()), 1)); Set(varViewDate, Today()); Select(btnAttLoadEngine)
                                    PaddingLeft: =6
                                    PaddingRight: =6
                                    Size: =14
                                    Text: ="This month"
                                    Width: =88
                        - conAttViewBar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =ColorWhite
                              FillPortions: =0
                              Height: =58
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =382
                            Children:
                              - tabAttViewMode:
                                  Control: ModernTabList
                                  Properties:
                                    AccessibleLabel: ="Month or Day view"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =TabListAppearance.Subtle
                                    BasePaletteColor: =ColorTeal
                                    Color: =ColorInk
                                    Default: |-
                                      =If(conAttRoot.Width < 640, {Value: "Day"}, {Value: "Month"})
                                    Height: =44
                                    Items: =["Month", "Day"]
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    TabSize: =TabSize.Small
                                    Width: =160
                              - btnAttDetailsToggle:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Details mode – tap a marked cell to open its details"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =If(varDetailsMode, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varDetailsMode, ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varDetailsMode, !varDetailsMode); Set(varDetailOpen, false)
                                    Size: =14
                                    Text: =If(varDetailsMode, "Details on", "Details mode")
                                    Width: =130
                              - btnAttRefresh:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Reload month"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnAttLoadEngine)
                                    Size: =14
                                    Text: ="Reload"
                                    Width: =76
                  - conAttScope:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =58
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =300
                      Children:
                        - conAttCampusField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =146
                            Children:
                              - lblAttCampus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Campus"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Campus"
                                    Wrap: =false
                              - ddAttCampus:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Campus"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Default: =varCampus
                                    DisplayMode: =If(CanPickCampus && !varLoading, DisplayMode.Edit, DisplayMode.Disabled)
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Name
                                    Items: =Sort(Campuses, Name, SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Set(varCampus, Self.Selected); Set(varTeacher, First(Sort(Filter(Staff, Campus.Campus = varCampus.Campus && 'App Role' = 'App Role (Staff)'.Teacher), Name, SortOrder.Ascending))); Select(btnAttLoadEngine)
                        - conAttTeacherField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =146
                            Children:
                              - lblAttTeacher:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Teacher"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Teacher"
                                    Wrap: =false
                              - ddAttTeacher:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Teacher"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Default: =varTeacher
                                    DisplayMode: =If((CanPickTeacher || IsTeacherRole) && !varLoading, DisplayMode.Edit, DisplayMode.Disabled)
                                    Height: =36
                                    ItemDisplayText: =ThisItem.Name
                                    Items: =Sort(Filter(Staff, Campus.Campus = varCampus.Campus && 'App Role' = 'App Role (Staff)'.Teacher), Name, SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Set(varTeacher, Self.Selected); Select(btnAttLoadEngine)
            - conAttNotice:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =If(varLoadError <> "", ColorErrorBg, ColorWarnBg)
                  FillPortions: =0
                  Height: =If(conAttRoot.Width < 640, 68, conAttRoot.Width < 1024, 56, 44)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =4
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  Visible: =StaffReady && lblAttNotice.Text <> ""
                Children:
                  - lblAttNotice:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Notice " & Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FillPortions: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: |-
                          =If(
                              varLoadError <> "", "Could not load attendance — " & varLoadError & ". Use Reload to try again.",
                              !(IsTeacherRole && !IsBlank(varTeacher) && varTeacher.Staff = CurrentStaff.Staff),
                              "View only — " & If(IsTeacherRole, "this is " & varTeacher.Name & "'s grid. You can mark attendance only on your own grid.", IsOfficeRole, "teachers mark attendance. Absences (0) come from parent reports you approve on the Absences screen.", "attendance is marked by each teacher on their own grid."),
                              !IsBlank(varMonthLock), Text(varMonthStart, "mmmm yyyy") & " is locked for " & varCampus.Name & " — " & Coalesce(varMonthLock.Reason, "no reason given") & ". Cells are read-only.",
                              ""
                          )
            - spnAttLoading:
                Control: ModernSpinner
                Properties:
                  AccessibleLabel: ="Loading attendance"
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorInk
                  Label: ="Loading " & Text(varMonthStart, "mmmm yyyy") & "…"
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  SpinnerColor: =ColorTeal
                  Visible: =varLoading
            - conAttReceipt:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =Switch(varLastAction.Kind, "Conflict", ColorWarnBg, "Failed", ColorErrorBg, "Blocked", ColorErrorBg, ColorInfoBg)
                  FillPortions: =0
                  Height: =If(conAttRoot.Width < 640, 124, conAttRoot.Width < 1024, 72, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =6
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =6
                  Visible: =varLastAction.Kind <> ""
                Children:
                  - lblAttReceipt:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Last action " & varLastAction.Message
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FillPortions: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =varLastAction.Message
                  - btnAttReceiptDismiss:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Dismiss last action message"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        Color: =ColorInk
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varLastAction, {Kind: "", Message: "", StudentId: ZeroGuid, DayNum: 0})
                        Size: =14
                        Text: ="Dismiss"
                        Width: =88
            - conAttConfirm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorUnexcused
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorErrorBg
                  FillPortions: =0
                  Height: =If(conAttRoot.Width < 640, 164, 120)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varConfirmOpen
                Children:
                  - lblAttConfirmText:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =If(conAttRoot.Width < 640, 88, 44)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |-
                          =With({a: LookUp(colMonthAtt, StudentId = varClearKey.StudentId && DayNum = varClearKey.DayNum && !IsDeleted), c: LookUp(colMonthCells, StudentId = varClearKey.StudentId && DayNum = varClearKey.DayNum)}, "Undo the 1 (present) for " & c.StudentName & " on " & Text(c.CellDate, "dddd mmmm d") & "? The row is kept and marked deleted (audit logged); you can mark the day again later.")
                  - conAttConfirmActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnAttConfirmClear:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Confirm undo"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorUnexcused
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varConfirmOpen, false); Set(varSaveReq, {StudentId: varClearKey.StudentId, DayNum: varClearKey.DayNum, Target: "clear"}); Select(btnAttSaveEngine)
                              Size: =14
                              Text: ="Confirm undo"
                              Width: =132
                        - btnAttConfirmCancel:
                            Control: ModernButton
