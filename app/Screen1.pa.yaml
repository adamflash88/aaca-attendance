                                          Width: =88
            - btnAttSaveEngine:
                Control: Classic/Button
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoDisableOnSelect: =false
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =With(
                        {
                            req: varSaveReq,
                            cell: LookUp(colMonthCells, StudentId = varSaveReq.StudentId && DayNum = varSaveReq.DayNum)
                        },
                        With(
                            {
                                seg: LookUp(colMonthEnr, EnrId = cell.EnrId),
                                local: LookUp(colMonthAtt, StudentId = req.StudentId && DayNum = req.DayNum),
                                term: LookUp(colMonthTerms, ThisRecord.'Term (aaca_termid)' = LookUp(colMonthDays, DayNum = req.DayNum).TermId),
                                dateText: Text(cell.CellDate, "ddd mmm d")
                            },
                            If(
                                IsBlank(cell) || cell.State <> "Open" || !varCanEditMonth || !(req.Target in ["P", "clear"]) || (req.Target = "clear" && (IsBlank(local) || local.IsDeleted || !local.Present)) || (req.Target = "clear" && !IsBlank(local) && local.LeftEarly) ||(req.Target = "P" && !IsBlank(local) && !local.IsDeleted && !local.Present),
                                Set(varLastAction, {Kind: "Blocked", Message: "Not saved · " & cell.StudentName & " · " & dateText & " · " & If(!varCanEditMonth, "view only — teachers mark only their own grid, and not in a locked month", req.Target = "clear" && !IsBlank(local) && local.LeftEarly, "left early was recorded by the office and can't be undone here",!IsBlank(local) && !local.IsDeleted && !local.Present, "absences (0) come from approved parent reports and can't be changed here", Coalesce(cell.Reason, "cell not editable")), StudentId: req.StudentId, DayNum: req.DayNum}),
                                RemoveIf(colCellState, StudentId = req.StudentId && DayNum = req.DayNum);
                                Collect(colCellState, {StudentId: req.StudentId, DayNum: req.DayNum, SaveState: "saving", Target: req.Target});
                                With(
                                    {server: With({qSid: req.StudentId, qSvc: seg.ServiceId, qDate: cell.CellDate}, LookUp(Attendance, Student.Student = qSid && Service.Service = qSvc && Date = qDate))},
                                    If(
                                        IsError(server),
                                        RemoveIf(colCellState, StudentId = req.StudentId && DayNum = req.DayNum);
                                        Collect(colCellState, {StudentId: req.StudentId, DayNum: req.DayNum, SaveState: "failed", Target: req.Target});
                                        Set(varLastAction, {Kind: "Failed", Message: "Failed · " & cell.StudentName & " · " & dateText & " · " & Switch(req.Target, "P", "Present", "Undo") & " was not saved — tap the cell (or the Day view button) to retry", StudentId: req.StudentId, DayNum: req.DayNum}),
                                        (!IsBlank(local) && local.ModifiedOn <> server.'Modified On') || (IsBlank(local) && !IsBlank(server) && server.'Is Deleted' <> true),
                                        RemoveIf(colMonthAtt, StudentId = req.StudentId && DayNum = req.DayNum);
                                        If(!IsBlank(server), Collect(colMonthAtt, {AttId: server.Attendance, StudentId: server.Student.Student, DayNum: Day(server.Date), AttDate: server.Date, Present: server.Present = true, IsDeleted: server.'Is Deleted' = true, Letter: If(server.Present = true, "P", server.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "E", server.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "U", "A"), ClassText: If(server.Present = true, "—", IsBlank(server.'Absence Classification'), "Not classified", Text(server.'Absence Classification')), IepText: Text(server.'IEP Ratio'), Notes: server.Notes, RecordKey: server.'Record Key', ModifiedOn: server.'Modified On', SourceReportId: server.'Source Report ID', ReasonName: Coalesce(server.'Absence Reason'.Name, ""), LeftEarly: server.'Left Early' = true, LeftEarlyAt: server.'Left Early At'}));
                                        RemoveIf(colCellState, StudentId = req.StudentId && DayNum = req.DayNum);
                                        Set(varLastAction, {Kind: "Conflict", Message: "Changed by someone else — reloaded · " & cell.StudentName & " · " & dateText & " · now " & If(IsBlank(server) || server.'Is Deleted' = true, "Not recorded", If(server.Present = true, "Present", server.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "Absent (excused)", server.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "Absent (unexcused)", "Absent (not classified)")) & " · your change was not saved", StudentId: req.StudentId, DayNum: req.DayNum}),
                                        With(
                                            {
                                                wasDeleted: !IsBlank(server) && server.'Is Deleted' = true,
                                                written: IfError(
                                                    If(
                                                        req.Target = "clear",
                                                        Patch(Attendance, server, {'Is Deleted': true}),
                                                        Patch(
                                                            Attendance,
                                                            Coalesce(server, Defaults(Attendance)),
                                                            {
                                                                'Record Key': Text(cell.CellDate, "yyyymmdd") & "|" & seg.StudentNumber & "|" & seg.ServiceCode,
                                                                Date: cell.CellDate,
                                                                Student: seg.EnrRec.Student,
                                                                Service: seg.EnrRec.Service,
                                                                Enrollment: seg.EnrRec,
                                                                Teacher: varTeacher,
                                                                Campus: seg.EnrRec.Campus,
                                                                'School Year': seg.EnrRec.'School Year',
                                                                Term: term,
                                                                'IEP Ratio': Switch(
                                                                    seg.EnrRec.'IEP Ratio',
                                                                    'IEP Ratio (Enrollments)'.'No Aide', 'IEP Ratio (Attendance)'.'No Aide',
                                                                    'IEP Ratio (Enrollments)'.'1:1', 'IEP Ratio (Attendance)'.'1:1',
                                                                    'IEP Ratio (Enrollments)'.'2:1', 'IEP Ratio (Attendance)'.'2:1',
                                                                    'IEP Ratio (Enrollments)'.'3:1', 'IEP Ratio (Attendance)'.'3:1',
                                                                    'IEP Ratio (Enrollments)'.'4:1', 'IEP Ratio (Attendance)'.'4:1'
                                                                ),
                                                                Present: req.Target = "P",
                                                                'Is Deleted': false
                                                            }
                                                        )
                                                    ),
                                                    Blank()
                                                )
                                            },
                                            If(
                                                IsBlank(written),
                                                RemoveIf(colCellState, StudentId = req.StudentId && DayNum = req.DayNum);
                                                Collect(colCellState, {StudentId: req.StudentId, DayNum: req.DayNum, SaveState: "failed", Target: req.Target});
                                                Set(varLastAction, {Kind: "Failed", Message: "Failed · " & cell.StudentName & " · " & dateText & " · " & Switch(req.Target, "P", "Present", "Undo") & " was not saved — tap the cell (or the Day view button) to retry", StudentId: req.StudentId, DayNum: req.DayNum}),
                                                With(
                                                    {
                                                        audit: If(
                                                            req.Target = "clear",
                                                            IfError(
                                                                Patch(
                                                                    'Audit Events',
                                                                    Defaults('Audit Events'),
                                                                    {
                                                                        Summary: "Attendance soft-deleted " & written.'Record Key',
                                                                        Action: 'Action (Audit Events)'.'Soft Delete',
                                                                        Entity: "aaca_attendance",
                                                                        'Entity ID': Text(written.Attendance),
                                                                        Before: "Is Deleted=No; Present=" & If(local.Present, "Yes", "No"),
                                                                        After: "Is Deleted=Yes",
                                                                        Reason: "Cleared in Attendance Matrix"
                                                                    }
                                                                ),
                                                                Blank()
                                                            ),
                                                            Blank()
                                                        )
                                                    },
                                                    RemoveIf(colMonthAtt, StudentId = req.StudentId && DayNum = req.DayNum);
                                                    Collect(colMonthAtt, {AttId: written.Attendance, StudentId: written.Student.Student, DayNum: Day(written.Date), AttDate: written.Date, Present: written.Present = true, IsDeleted: written.'Is Deleted' = true, Letter: If(written.Present = true, "P", written.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "E", written.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "U", "A"), ClassText: If(written.Present = true, "—", IsBlank(written.'Absence Classification'), "Not classified", Text(written.'Absence Classification')), IepText: Text(written.'IEP Ratio'), Notes: written.Notes, RecordKey: written.'Record Key', ModifiedOn: written.'Modified On', SourceReportId: written.'Source Report ID', ReasonName: Coalesce(written.'Absence Reason'.Name, ""), LeftEarly: written.'Left Early' = true, LeftEarlyAt: written.'Left Early At'});
                                                    RemoveIf(colCellState, StudentId = req.StudentId && DayNum = req.DayNum);
                                                    Collect(colCellState, {StudentId: req.StudentId, DayNum: req.DayNum, SaveState: "saved", Target: req.Target});
                                                    Set(
                                                        varLastAction,
                                                        {
                                                            Kind: If(req.Target = "clear", "Cleared", wasDeleted, "Restored", "Saved"),
                                                            Message: If(
                                                                req.Target = "clear",
                                                                "Undone · " & cell.StudentName & " · " & dateText & " · Is Deleted = Yes · Key " & written.'Record Key' & If(IsBlank(audit), " · audit event NOT written", " · audit event written"),
                                                                If(wasDeleted, "Restored · ", "Saved · ") & cell.StudentName & " · " & dateText & " · Status " & If(written.Present = true, "Present", written.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "Absent (excused)", written.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "Absent (unexcused)", "Absent (not classified)") & " · IEP " & Text(written.'IEP Ratio') & " · Teacher " & varTeacher.Name & " · Term " & term.Name & " · Key " & written.'Record Key'
                                                            ),
                                                            StudentId: req.StudentId,
                                                            DayNum: req.DayNum
                                                        }
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                  Text: ="save"
                  Visible: =false
            - btnAttBulkEngine:
                Control: Classic/Button
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoDisableOnSelect: =false
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =With(
                        {
                            dn: varBulkDay,
                            cd: Date(Year(varMonthStart), Month(varMonthStart), varBulkDay),
                            term: LookUp(colMonthTerms, ThisRecord.'Term (aaca_termid)' = LookUp(colMonthDays, DayNum = varBulkDay).TermId)
                        },
                        If(
                            !varCanEditMonth || CountRows(Filter(colMonthCells, DayNum = dn && State = "Open")) = 0,
                            Set(varLastAction, {Kind: "Blocked", Message: "All present not available · " & Text(cd, "ddd mmm d") & " · no editable cells (non-school, future, locked or view-only)", StudentId: ZeroGuid, DayNum: dn}),
                            Clear(colBulkLog);
                            ForAll(
                                Filter(colMonthCells, DayNum = dn && State = "Open") As c,
                                With(
                                    {
                                        seg: LookUp(colMonthEnr, EnrId = c.EnrId),
                                        local: LookUp(colMonthAtt, StudentId = c.StudentId && DayNum = dn)
                                    },
                                    If(
                                        !IsBlank(local) && !local.IsDeleted,
                                        Collect(colBulkLog, {StudentId: c.StudentId, Outcome: "skipped"}),
                                        With(
                                            {server: With({qSid: c.StudentId, qSvc: seg.ServiceId, qDate: cd}, LookUp(Attendance, Student.Student = qSid && Service.Service = qSvc && Date = qDate))},
                                            If(
                                                IsError(server),
                                                RemoveIf(colCellState, StudentId = c.StudentId && DayNum = dn);
                                                Collect(colCellState, {StudentId: c.StudentId, DayNum: dn, SaveState: "failed", Target: "P"});
                                                Collect(colBulkLog, {StudentId: c.StudentId, Outcome: "failed"}),
                                                (!IsBlank(local) && local.ModifiedOn <> server.'Modified On') || (IsBlank(local) && !IsBlank(server) && server.'Is Deleted' <> true),
                                                RemoveIf(colMonthAtt, StudentId = c.StudentId && DayNum = dn);
                                                If(!IsBlank(server), Collect(colMonthAtt, {AttId: server.Attendance, StudentId: server.Student.Student, DayNum: Day(server.Date), AttDate: server.Date, Present: server.Present = true, IsDeleted: server.'Is Deleted' = true, Letter: If(server.Present = true, "P", server.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "E", server.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "U", "A"), ClassText: If(server.Present = true, "—", IsBlank(server.'Absence Classification'), "Not classified", Text(server.'Absence Classification')), IepText: Text(server.'IEP Ratio'), Notes: server.Notes, RecordKey: server.'Record Key', ModifiedOn: server.'Modified On', SourceReportId: server.'Source Report ID', ReasonName: Coalesce(server.'Absence Reason'.Name, ""), LeftEarly: server.'Left Early' = true, LeftEarlyAt: server.'Left Early At'}));
                                                Collect(colBulkLog, {StudentId: c.StudentId, Outcome: "skipped"}),
                                                With(
                                                    {
                                                        written: IfError(
                                                            Patch(
                                                                Attendance,
                                                                Coalesce(server, Defaults(Attendance)),
                                                                {
                                                                    'Record Key': Text(c.CellDate, "yyyymmdd") & "|" & seg.StudentNumber & "|" & seg.ServiceCode,
                                                                    Date: c.CellDate,
                                                                    Student: seg.EnrRec.Student,
                                                                    Service: seg.EnrRec.Service,
                                                                    Enrollment: seg.EnrRec,
                                                                    Teacher: varTeacher,
                                                                    Campus: seg.EnrRec.Campus,
                                                                    'School Year': seg.EnrRec.'School Year',
                                                                    Term: term,
                                                                    'IEP Ratio': Switch(
                                                                        seg.EnrRec.'IEP Ratio',
                                                                        'IEP Ratio (Enrollments)'.'No Aide', 'IEP Ratio (Attendance)'.'No Aide',
                                                                        'IEP Ratio (Enrollments)'.'1:1', 'IEP Ratio (Attendance)'.'1:1',
                                                                        'IEP Ratio (Enrollments)'.'2:1', 'IEP Ratio (Attendance)'.'2:1',
                                                                        'IEP Ratio (Enrollments)'.'3:1', 'IEP Ratio (Attendance)'.'3:1',
                                                                        'IEP Ratio (Enrollments)'.'4:1', 'IEP Ratio (Attendance)'.'4:1'
                                                                    ),
                                                                    Present: true,
                                                                    'Is Deleted': false
                                                                }
                                                            ),
                                                            Blank()
                                                        )
                                                    },
                                                    If(
                                                        IsBlank(written),
                                                        RemoveIf(colCellState, StudentId = c.StudentId && DayNum = dn);
                                                        Collect(colCellState, {StudentId: c.StudentId, DayNum: dn, SaveState: "failed", Target: "P"});
                                                        Collect(colBulkLog, {StudentId: c.StudentId, Outcome: "failed"}),
                                                        RemoveIf(colMonthAtt, StudentId = c.StudentId && DayNum = dn);
                                                        Collect(colMonthAtt, {AttId: written.Attendance, StudentId: written.Student.Student, DayNum: Day(written.Date), AttDate: written.Date, Present: written.Present = true, IsDeleted: written.'Is Deleted' = true, Letter: If(written.Present = true, "P", written.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "E", written.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "U", "A"), ClassText: If(written.Present = true, "—", IsBlank(written.'Absence Classification'), "Not classified", Text(written.'Absence Classification')), IepText: Text(written.'IEP Ratio'), Notes: written.Notes, RecordKey: written.'Record Key', ModifiedOn: written.'Modified On', SourceReportId: written.'Source Report ID', ReasonName: Coalesce(written.'Absence Reason'.Name, ""), LeftEarly: written.'Left Early' = true, LeftEarlyAt: written.'Left Early At'});
                                                        RemoveIf(colCellState, StudentId = c.StudentId && DayNum = dn);
                                                        Collect(colCellState, {StudentId: c.StudentId, DayNum: dn, SaveState: "saved", Target: "P"});
                                                        Collect(colBulkLog, {StudentId: c.StudentId, Outcome: "marked"})
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                            );
                            Set(varLastAction, {Kind: "Bulk", Message: "All present · " & Text(cd, "ddd mmm d") & " · " & CountRows(Filter(colBulkLog, Outcome = "marked")) & " marked, " & CountRows(Filter(colBulkLog, Outcome = "skipped")) & " skipped (already recorded or changed by someone else), " & CountRows(Filter(colBulkLog, Outcome = "failed")) & " failed", StudentId: ZeroGuid, DayNum: dn})
                        )
                    )
                  Text: ="bulk"
                  Visible: =false
            - btnAttLoadEngine:
                Control: Classic/Button
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoDisableOnSelect: =false
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Set(varLoading, true);
                    Set(varLoadError, "");
                    Set(varMonthEnd, DateAdd(DateAdd(varMonthStart, 1, TimeUnit.Months), -1, TimeUnit.Days));
                    Set(varDetailOpen, false);
                    Set(varConfirmOpen, false);
                    Clear(colCellState);
                    If(
                        !StaffReady || IsBlank(varTeacher),
                        Clear(colMonthEnr); Clear(colMonthAtt); Clear(colMonthExceptions); Clear(colMonthTerms);
                        Clear(colMonthDays); Clear(colMonthStudents); Clear(colMonthCells),
                        IfError(
                            Concurrent(
                                ClearCollect(
                                    colMonthEnr,
                                    ForAll(
                                        Filter(Enrollments, Teacher.Staff = varTeacher.Staff && 'Start Date' <= varMonthEnd && (IsBlank('End Date') || 'End Date' >= varMonthStart)) As e,
                                        {
                                            EnrId: e.Enrollment,
                                            StudentId: e.Student.Student,
                                            StudentName: e.Student.'Display Name',
                                            StudentNumber: e.Student.'Student Number',
                                            ServiceId: e.Service.Service,
                                            ServiceCode: e.Service.'Service Code',
                                            StartDate: e.'Start Date',
                                            EndDate: e.'End Date',
                                            IsSummer: false,
                                            IepText: Text(e.'IEP Ratio'),
                                            EnrRec: e
                                        }
                                    )
                                ),
                                ClearCollect(
                                    colMonthAtt,
                                    ForAll(
                                        Filter(Attendance, Teacher.Staff = varTeacher.Staff && Date >= varMonthStart && Date <= varMonthEnd) As r,
                                        {AttId: r.Attendance, StudentId: r.Student.Student, DayNum: Day(r.Date), AttDate: r.Date, Present: r.Present = true, IsDeleted: r.'Is Deleted' = true, Letter: If(r.Present = true, "P", r.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "E", r.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "U", "A"), ClassText: If(r.Present = true, "—", IsBlank(r.'Absence Classification'), "Not classified", Text(r.'Absence Classification')), IepText: Text(r.'IEP Ratio'), Notes: r.Notes, RecordKey: r.'Record Key', ModifiedOn: r.'Modified On', SourceReportId: r.'Source Report ID', ReasonName: Coalesce(r.'Absence Reason'.Name, ""), LeftEarly: r.'Left Early' = true, LeftEarlyAt: r.'Left Early At'}
                                    )
                                ),
                                ClearCollect(colMonthExceptions, Filter('Calendar Exceptions', Date >= varMonthStart && Date <= varMonthEnd)),
                                ClearCollect(colMonthTerms, Filter(Terms, 'Start Date' <= varMonthEnd && 'End Date' >= varMonthStart)),
                                Set(varMonthLock, LookUp('Month Locks', Campus.Campus = varCampus.Campus && Month = varMonthStart && 'Status (aaca_status)' = 'Status (Month Locks)'.Locked))
                            ),
                            Set(varLoadError, FirstError.Message)
                        );
                        Clear(colMonthDays);
                        ForAll(
                            Sequence(Day(varMonthEnd)) As n,
                            With(
                                {d: Date(Year(varMonthStart), Month(varMonthStart), n.Value)},
                                With(
                                    {
                                        t: First(Filter(colMonthTerms, ThisRecord.'Start Date' <= d && ThisRecord.'End Date' >= d && (IsBlank(ThisRecord.Campus) || ThisRecord.Campus.Campus = varCampus.Campus))),
                                        x: LookUp(colMonthExceptions, ThisRecord.Date = d && (IsBlank(ThisRecord.Campus) || ThisRecord.Campus.Campus = varCampus.Campus) && ThisRecord.Type <> 'Type (Calendar Exceptions)'.'Make-up School Day'),
                                        mk: !IsBlank(LookUp(colMonthExceptions, ThisRecord.Date = d && (IsBlank(ThisRecord.Campus) || ThisRecord.Campus.Campus = varCampus.Campus) && ThisRecord.Type = 'Type (Calendar Exceptions)'.'Make-up School Day')),
                                        wkend: Weekday(d, StartOfWeek.Monday) >= 6
                                    },
                                    Collect(
                                        colMonthDays,
                                        {
                                            DayNum: n.Value,
                                            CellDate: d,
                                            DowLabel: Text(d, "ddd"),
                                            TermId: t.'Term (aaca_termid)',
                                            TermKind: If(IsBlank(t), "", t.'Term (aaca_term)' = 'Term (Terms)'.ESY, "ESY", "Regular"),
                                            IsSchoolDay: !IsBlank(t) && (mk || (!wkend && IsBlank(x))),
                                            NonSchoolReason: If(IsBlank(t), "Outside any term", mk, "", !IsBlank(x), Text(x.Type) & " – " & x.Description, wkend, "Weekend", "")
                                        }
                                    )
                                )
                            )
                        );
                        ClearCollect(
                            colMonthStudents,
                            Sort(
                                ForAll(
                                    Distinct(colMonthEnr, StudentId) As g,
                                    With({en: LookUp(colMonthEnr, StudentId = g.Value)}, {StudentId: g.Value, StudentName: en.StudentName, StudentNumber: en.StudentNumber})
                                ),
                                StudentName,
                                SortOrder.Ascending
                            )
                        );
                        Clear(colMonthCells);
                        ForAll(
                            colMonthStudents As s,
                            Collect(
                                colMonthCells,
                                ForAll(
                                    colMonthDays As dd,
                                    With(
                                        {seg: LookUp(colMonthEnr, StudentId = s.StudentId && StartDate <= dd.CellDate && (IsBlank(EndDate) || EndDate >= dd.CellDate))},
                                        {
                                            StudentId: s.StudentId,
                                            StudentName: s.StudentName,
                                            DayNum: dd.DayNum,
                                            CellDate: dd.CellDate,
                                            EnrId: seg.EnrId,
                                            State: If(!dd.IsSchoolDay, "NonSchool", IsBlank(seg), "NotEnrolled", dd.CellDate > Today() && !AllowFutureDates, "Future", "Open"),
                                            Reason: If(!dd.IsSchoolDay, dd.NonSchoolReason, IsBlank(seg), "Not enrolled with this teacher on this day", dd.CellDate > Today() && !AllowFutureDates, "Future date", "")
                                        }
                                    )
                                )
                            )
                        )
                    );
                    Set(varCanEditMonth, IsTeacherRole && !IsBlank(varTeacher) && varTeacher.Staff = CurrentStaff.Staff && IsBlank(varMonthLock) && varLoadError = "");
                    If(
                        varViewDate < varMonthStart || varViewDate > varMonthEnd,
                        Set(varViewDate, If(Today() >= varMonthStart && Today() <= varMonthEnd, Today(), varMonthStart))
                    );
                    Set(varLoading, false)
                  Text: ="load"
                  Visible: =false
