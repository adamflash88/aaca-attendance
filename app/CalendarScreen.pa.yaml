                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
                                                Text: ="End *"
                                                Wrap: =false
                                    - galCalPer:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Period dates"
                                          FillPortions: =0
                                          Height: =CountRows(colCalPerEdit) * 44
                                          Items: =colCalPerEdit
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LoadingSpinner: =LoadingSpinner.None
                                          Selectable: =false
