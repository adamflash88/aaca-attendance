                                                      Color: =ColorInk
                                                      DefaultDate: =varCalFrom
                                                      DisplayMode: =If(varCalSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                                      EndDate: =LookUp(colCalYearOpts, YearId = varCalYearId).E
                                                      Format: =DatePickerFormat.Short
                                                      Height: =36
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
