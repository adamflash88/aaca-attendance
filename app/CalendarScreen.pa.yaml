                                            !IsBlank(nx) && b.S > nx,
                                            Collect(colCalChecks, {Sev: "error", Line: "Gap between Q" & n.Value & " and Q" & (n.Value + 1) & ": school days " & Concat(Filter(colCalYearDays, Open && D >= nx && D < b.S), Text(D, "m/d/yyyy"), ", ") & " are in no quarter."})
