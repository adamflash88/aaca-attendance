Screens:
  CalendarScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =Set(varCalSaving, false);
        Set(varCalLoading, false);
        Set(varCalReceipt, {Kind: "", Title: ""});
        Clear(colCalReceiptLines);
        ClearCollect(colCalCampusOpts, ForAll(Sort(Campuses, Name, SortOrder.Ascending) As c, {CampusId: c.Campus, CampusName: c.Name, Code: Coalesce(c.Code, "")}));
        ClearCollect(colCalYearOpts, ForAll(Sort('School Years', 'Start Date', SortOrder.Descending) As yy, {YearId: yy.'School Year', YearName: yy.Name, S: yy.'Start Date', E: yy.'End Date', StatusText: Text(yy.'Status (aaca_status)')}));
        If(IsBlank(LookUp(colCalYearOpts, YearId = varCalYearId)), Set(varCalYearId, Coalesce(CurrentSchoolYear.'School Year', First(colCalYearOpts).YearId, ZeroGuid)));
        If(IsBlank(LookUp(colCalCampusOpts, CampusId = varCalCampusId)), Set(varCalCampusId, Coalesce(First(colCalCampusOpts).CampusId, ZeroGuid)));
        ClearCollect(colCalAlso, ForAll(Filter(colCalCampusOpts, CampusId <> varCalCampusId) As c, {CampusId: c.CampusId, CampusName: c.CampusName, Ticked: false}));
        Set(varCalCopyTargetId, Blank());
        Select(btnCalLoadEngine)
    Children:
      - conCalRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conCalHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conCalRoot.Width < 640, 92, 76) + If(CanManageStudents, If(conCalRoot.Width < 640, 152, conCalRoot.Width < 800, 100, 48), 48) + If(IsAdminRole, If(conCalRoot.Width >= 728, 60, conCalRoot.Width >= 576, 112, 164), 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(IsAdminRole, 0, 12)
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblCalTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Attendance"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Attendance"
                        Wrap: =false
                  - lblCalIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conCalRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =0
                        Size: =12
                        Text: =Coalesce(CurrentUserRow.'Full Name', User().FullName) & " · " & RoleLabel & " · " & If(!StaffReady, "no campus", IsBlank(CurrentStaff.Campus), "All campuses", CurrentStaff.Campus.Name)
                        VerticalAlign: =VerticalAlign.Top
                  - conCalNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(CanManageStudents, If(conCalRoot.Width < 640, 148, conCalRoot.Width < 800, 96, 44) + If(IsAdminRole, 8, 0), 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingLeft: =16
                        PaddingRight: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnCalNavAttendance:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Attendance"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(Screen1)
                              Size: =14
                              Text: ="Attendance"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnCalNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnCalNavAbsences:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Absences"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(AbsencesScreen)
                              Size: =14
                              Text: ="Absences"
                              Visible: =CanManageStudents
                              Width: =110
                        - btnCalNavTransport:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Transportation"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(TransportScreen)
                              Size: =14
                              Text: ="Transportation"
                              Visible: =CanClassify
                              Width: =140
                        - btnCalNavStaff:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Staff"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StaffScreen)
                              Size: =14
                              Text: ="Staff"
                              Visible: =CanManageStudents
                              Width: =80
                        - btnCalNavCalendar:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Calendar (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(CalendarScreen)
                              Size: =14
                              Text: ="Calendar"
                              Visible: =IsAdminRole
                              Width: =100
                        - conCalNavSpacer:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =conCalRoot.Width >= 640
                        - imgCalNavHelp:
                            Control: Image
                            Properties:
                              AccessibleLabel: =If(varHelpOpen, "Close NEXUS help", "Open NEXUS help")
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =ColorViolet
                              BorderThickness: =If(varHelpOpen, 3, 0)
                              FocusedBorderThickness: =3
                              Height: =44
                              HoverBorderColor: =ColorCyan
                              Image: =NexusLogo
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varHelpOpen, !varHelpOpen)
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              TabIndex: =0
                              Tooltip: =If(varHelpOpen, "Close NEXUS help", "Ask NEXUS for help")
                              Width: =44
                  - conCalHdrBar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorPaper
                        FillPortions: =0
                        Height: =If(conCalRoot.Width >= 728, 60, conCalRoot.Width >= 576, 112, 164)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =IsAdminRole
                      Children:
                        - conCalYearField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =272
                            Children:
                              - lblCalYear:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="School year"
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="School year"
                                    Width: =84
                                    Wrap: =false
                              - ddCalYear:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="School year"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Default: =LookUp(colCalYearOpts, YearId = varCalYearId)
                                    DisplayMode: =If(!varCalLoading && !varCalSaving, DisplayMode.Edit, DisplayMode.Disabled)
                                    Height: =36
                                    ItemDisplayText: =ThisItem.YearName & If(ThisItem.StatusText = "", "", " (" & ThisItem.StatusText & ")")
                                    Items: =colCalYearOpts
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varCalYearId, Coalesce(Self.Selected.YearId, varCalYearId));
                                      Set(varCalFrom, Blank());
                                      Set(varCalTo, Blank());
                                      Set(varCalPickTo, false);
                                      Select(btnCalLoadEngine)
                                    Width: =180
                        - conCalCampusField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =264
                            Children:
                              - lblCalCampus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Campus"
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Campus"
                                    Width: =56
                                    Wrap: =false
                              - ddCalCampus:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Campus"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Default: =LookUp(colCalCampusOpts, CampusId = varCalCampusId)
                                    DisplayMode: =If(!varCalLoading && !varCalSaving, DisplayMode.Edit, DisplayMode.Disabled)
                                    Height: =36
                                    ItemDisplayText: =ThisItem.CampusName
                                    Items: =colCalCampusOpts
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varCalCampusId, Coalesce(Self.Selected.CampusId, varCalCampusId));
                                      ClearCollect(colCalAlso, ForAll(Filter(colCalCampusOpts, CampusId <> varCalCampusId) As c, {CampusId: c.CampusId, CampusName: c.CampusName, Ticked: false}));
                                      Set(varCalFrom, Blank());
                                      Set(varCalTo, Blank());
                                      Set(varCalPickTo, false);
                                      Set(varCalCopyTargetId, Blank());
                                      Select(btnCalLoadEngine)
                                    Width: =200
                        - btnCalView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="View the printable calendar"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              DisplayMode: =If(IsAdminRole && !varCalLoading && !varCalSaving && varCalLoadError = "" && CountRows(colCalCells) > 0, DisplayMode.Edit, DisplayMode.Disabled)
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(CalendarPrintScreen)
                              Size: =14
                              Text: ="View calendar"
                              Width: =140
            - conCalHelp:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorViolet
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =If(conCalRoot.Width < 640, 460, 400)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varHelpOpen
                Children:
                  - conCalHelpHead:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblCalHelpTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorViolet
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="NEXUS · AACA Attendance help"
                              Wrap: =false
                        - btnCalHelpNew:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Start a new conversation with NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              DisplayMode: =If(varHelpBusy, DisplayMode.Disabled, DisplayMode.Edit)
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Clear(colHelpMsgs); Set(varHelpConvId, "")
                              Size: =13
                              Text: ="New conversation"
                              Width: =150
                        - btnCalHelpClose:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Close NEXUS help"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varHelpOpen, false)
                              Size: =13
                              Text: ="Close"
                              Width: =80
                  - spnCalHelpBusy:
                      Control: Spinner
                      Properties:
                        AccessibleLabel: ="NEXUS is looking up your answer"
                        AlignInContainer: =AlignInContainer.Stretch
                        FontColor: =ColorInk
                        FontSize: =13
                        Height: =32
                        Label: ="NEXUS is looking that up... answers usually take 10-30 seconds."
                        LabelPosition: ='Spinner.LabelPosition'.After
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SpinnerColor: =ColorViolet
                        SpinnerSize: ='Spinner.SpinnerSize'.Small
                        TrackColor: =ColorInfoBg
                        Visible: =varHelpBusy
                  - conCalHelpChat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorPaper
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                      Children:
                        - htmCalHelpChat:
                            Control: HtmlViewer
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =ColorInk
                              HtmlText: |-
                                =If(CountRows(colHelpMsgs) = 0, "<div style='color:#4E5876;padding:4px'>Hi, I am <b style='color:#7C3AED'>NEXUS</b>. Ask me how to do something in the AACA Attendance app, or what a button, mark or color means. For example: <i>How do I classify an absence?</i> or <i>What does 1* mean?</i></div>", Concat(Sort(colHelpMsgs, N, SortOrder.Descending), "<div style='margin:4px 0 4px 48px;padding:8px 12px;background:#2563EB;color:#FFFFFF;border-radius:12px 12px 2px 12px'>" & Substitute(Substitute(Substitute(Substitute(Substitute(Q, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), "**", ""), Char(10), "<br>") & "</div>" & If(A = "", "<div style='margin:4px 48px 14px 0;padding:8px 12px;color:#4E5876'><i>NEXUS is thinking...</i></div>", "<div style='margin:4px 48px 14px 0;padding:8px 12px;background:#FFFFFF;border:1px solid #D5DCEC;border-left:4px solid #7C3AED;color:#0F163A;border-radius:12px 12px 12px 2px'><b style='color:#7C3AED'>NEXUS</b><br>" & Substitute(Substitute(Substitute(Substitute(Substitute(A, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), "**", ""), Char(10), "<br>") & "</div>")))
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                  - conCalHelpAsk:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtCalHelpQ:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Your question for NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              Color: =ColorInk
                              FillPortions: =1
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              MaxLength: =500
                              Placeholder: ="Ask how to do something in the app..."
                        - btnCalHelpAsk:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Send the question to NEXUS"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorViolet
                              Color: =ColorWhite
                              DisplayMode: =If(varHelpBusy || Trim(txtCalHelpQ.Text) = "", DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =40
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With({q: Trim(txtCalHelpQ.Text), n: CountRows(colHelpMsgs) + 1},
                                    If(q <> "" && !varHelpBusy,
                                        Set(varHelpBusy, true);
                                        Collect(colHelpMsgs, {N: n, Q: q, A: ""});
                                        Reset(txtCalHelpQ);
                                        With({r: IfError('AACA-AskNEXUS'.Run(q, {ConversationId: Coalesce(varHelpConvId, ""), Context: HelpContextPrefix & " The user is on the Calendar screen (System Admin school calendar: days, periods, new school year, copy to campus, print view)."}), {answer: "NEXUS could not answer right now. Please try again in a moment.", conversationid: Coalesce(varHelpConvId, ""), ok: "false"})},
                                            Patch(colHelpMsgs, LookUp(colHelpMsgs, N = n), {A: Coalesce(r.answer, "NEXUS did not return an answer. Please try again.")});
                                            If(r.ok = "true" && !IsBlank(r.conversationid), Set(varHelpConvId, r.conversationid))
                                        );
                                        Set(varHelpBusy, false)
                                    )
                                )
                              Size: =14
                              Text: =If(varHelpBusy, "Asking...", "Ask")
                              Width: =100
                  - lblCalHelpNote:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorMuted
                        Height: =If(conCalRoot.Width < 640, 52, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="NEXUS answers from the AACA Resource Center and the Attendance user guide. Answers usually take 10-30 seconds. Check important details with your office."
                        VerticalAlign: =VerticalAlign.Top
            - conCalDenied:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + If(conCalRoot.Width < 640, 48, 24) + 8 + If(conCalRoot.Width < 640, 112, 48) + 8 + 44 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!IsAdminRole
                Children:
                  - lblCalDeniedTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Calendar is not available for your role"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =If(conCalRoot.Width < 640, 48, 24)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Calendar is not available for your role"
                        VerticalAlign: =VerticalAlign.Top
                  - lblCalDeniedBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =If(conCalRoot.Width < 640, 112, 48)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask your office manager to add you on the Staff screen.", "Only System Admins manage the school calendar. Ask a System Admin if a calendar date needs to change.")
                        VerticalAlign: =VerticalAlign.Top
                  - btnCalDeniedBack:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Back to Attendance"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Secondary
                        Color: =ColorInk
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Screen1)
                        Size: =14
                        Text: ="Back to Attendance"
                        Width: =190
            - conCalBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(conCalReceipt.Visible, conCalReceipt.Height + 8, 0) + If(lblCalNote.Visible, 36 + 8, 0) + conCalView.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
