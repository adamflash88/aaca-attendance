                                                FillPortions: =0
                                                Height: =58
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =156
                                              Children:
                                                - lblCalFrom:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: ="From date, required"
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =ColorMuted
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =18
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =12
                                                      Text: ="From *"
                                                      Wrap: =false
                                                - dpCalFrom:
                                                    Control: ModernDatePicker
