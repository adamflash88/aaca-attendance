                                                Color: =ColorMuted
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Semibold
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =12
