Screens:
  AbsencesScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =Set(varAbsSaving, false);
        Set(varAbsSelId, Blank());
        Set(varAbsReasonId, Blank());
        Set(varAbsReceipt, {Kind: "", Title: ""});
        Clear(colAbsReceiptLines);
        If(StudentCampusLock <> ZeroGuid, Set(varAbsCampusId, StudentCampusLock));
        IfError(
            Concurrent(
                ClearCollect(colAbsCampusOpts, ForAll(Sort(Campuses, Name, SortOrder.Ascending) As c, {CampusId: c.Campus, CampusName: c.Name})),
                ClearCollect(colAbsTeacherSrc, ForAll(Sort(Filter(Staff, 'App Role' = 'App Role (Staff)'.Teacher), Name, SortOrder.Ascending) As t, {TeacherId: t.Staff, TeacherName: t.Name, CampusId: t.Campus.Campus})),
                ClearCollect(colAbsReasons, ForAll(Sort(Filter('Absence Reasons', Active = true), 'Sort Order', SortOrder.Ascending) As a, {ReasonId: a.'Absence Reason', ReasonName: a.Name, SortOrder: a.'Sort Order'}))
            ); true,
            Set(varAbsLoadError, FirstError.Message)
        );
        ClearCollect(colAbsTeacherOpts, {TeacherId: ZeroGuid, TeacherName: "All teachers", CampusId: ZeroGuid}, colAbsTeacherSrc);
        Select(btnAbsLoadEngine)
    Children:
      - conAbsRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conAbsHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conAbsRoot.Width < 640, 92, 76) + If(CanManageStudents, 48, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblAbsTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Attendance"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Attendance"
                        Wrap: =false
                  - lblAbsIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conAbsRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =Coalesce(CurrentUserRow.'Full Name', User().FullName) & " · " & RoleLabel & " · " & If(!StaffReady, "no campus", IsBlank(CurrentStaff.Campus), "All campuses", CurrentStaff.Campus.Name)
                        VerticalAlign: =VerticalAlign.Top
                  - conAbsNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =CanManageStudents
                      Children:
                        - btnAbsNavAttendance:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Attendance"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(Screen1)
                              Size: =14
                              Text: ="Attendance"
                              Width: =110
                        - btnAbsNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Width: =110
                        - btnAbsNavAbsences:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Absences (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(AbsencesScreen)
                              Size: =14
                              Text: ="Absences"
                              Width: =110
            - conAbsDenied:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + 24 + 8 + If(conAbsRoot.Width < 640, 88, 48) + 8 + 44 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!CanClassify
                Children:
                  - lblAbsDeniedTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Absences is not available for your role"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Absences is not available for your role"
                        Wrap: =false
                  - lblAbsDeniedBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =If(conAbsRoot.Width < 640, 88, 48)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask a System Admin to set you up.", "Only the Attendance Office and System Admin roles classify absences. Teachers and Read-only users record and view attendance on the Attendance screen.")
                        VerticalAlign: =VerticalAlign.Top
                  - btnAbsDeniedBack:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Back to Attendance"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Secondary
                        Color: =ColorInk
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Screen1)
                        Size: =14
                        Text: ="Back to Attendance"
                        Width: =190
            - conAbsNotice:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorErrorBg
                  FillPortions: =0
                  Height: =If(conAbsRoot.Width < 640, 68, 44)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =4
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =CanClassify && varAbsLoadError <> ""
                Children:
                  - lblAbsNotice:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FillPortions: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Could not load absences — " & varAbsLoadError & ". Use Reload to try again."
            - spnAbsLoading:
                Control: ModernSpinner
                Properties:
                  AccessibleLabel: =If(varAbsSaving, "Saving classifications", "Loading absences")
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =ColorInk
                  Label: =If(varAbsSaving, "Saving classifications…", "Loading absences…")
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  SpinnerColor: =ColorTeal
                  Visible: =varAbsLoading || varAbsSaving
            - conAbsReceipt:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =Switch(varAbsReceipt.Kind, "Failed", ColorErrorBg, "Blocked", ColorErrorBg, "Cancelled", ColorWarnBg, ColorInfoBg)
                  FillPortions: =0
                  Height: =8 + If(conAbsRoot.Width < 640, 84, 44) + If(CountRows(colAbsReceiptLines) > 0, 4 + galAbsReceipt.Height, 0) + 8
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varAbsReceipt.Kind <> ""
                Children:
                  - conAbsReceiptTop:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(conAbsRoot.Width < 640, 84, 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblAbsReceiptTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =varAbsReceipt.Title
                              AlignInContainer: =AlignInContainer.Center
                              Color: =ColorInk
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =If(conAbsRoot.Width < 640, 84, 44)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: =varAbsReceipt.Title
                        - btnAbsReceiptDismiss:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Dismiss result"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varAbsReceipt, {Kind: "", Title: ""}); Clear(colAbsReceiptLines)
                              Size: =14
                              Text: ="Dismiss"
                              Width: =88
                  - galAbsReceipt:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Classification result details"
                        FillPortions: =0
                        Height: =Min(400, RoundUp(CountRows(colAbsReceiptLines) / If(conAbsRoot.Width < 640, 1, conAbsRoot.Width < 1024, 2, 3), 0) * 40)
                        Items: =colAbsReceiptLines
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Selectable: =false
                        TabIndex: =0
                        TemplatePadding: =0
                        TemplateSize: =40
                        Visible: =CountRows(colAbsReceiptLines) > 0
                        WrapCount: =If(conAbsRoot.Width < 640, 1, conAbsRoot.Width < 1024, 2, 3)
                      Children:
                        - conAbsRcptRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingBottom: =2
                              PaddingRight: =8
                              PaddingTop: =2
                              Width: =Parent.TemplateWidth - 16
                            Children:
                              - lblAbsRcptLabel:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =ThisItem.Label
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =ThisItem.Label
                                    VerticalAlign: =VerticalAlign.Top
                              - lblAbsRcptValue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =ThisItem.Label & " " & ThisItem.Value
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorInk
                                    FillPortions: =1
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =ThisItem.Value
                                    VerticalAlign: =VerticalAlign.Top
            - conAbsBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(conAbsRoot.Width >= 1024, Max(conAbsListPanel.Height, conAbsDecide.Height), If(conAbsListPanel.Visible, conAbsListPanel.Height, 0) + If(conAbsListPanel.Visible && conAbsDecide.Visible, 8, 0) + If(conAbsDecide.Visible, conAbsDecide.Height, 0))
                  LayoutAlignItems: =If(conAbsRoot.Width >= 1024, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                  LayoutDirection: =If(conAbsRoot.Width >= 1024, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =CanClassify
                Children:
                  - conAbsListPanel:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =If(conAbsRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                        BorderColor: =ColorRule
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorWhite
                        FillPortions: =If(conAbsRoot.Width >= 1024, 2, 0)
                        Height: |-
                          =With(
                              {n: conAbsRoot.Width < 640, k: CountRows(Filter(colAbsList, (varAbsTeacherId = ZeroGuid || TeacherId = varAbsTeacherId) && (varAbsStatus = "All" || ClassText = varAbsStatus))) > 0},
                              16 + 44 + 8 + 58 + 8 + 58 + 8 + If(n, 138, 58) + 8 + 44 + 8 + If(n, 110, 58) + 8 + If(n, 36, 18) + 8 + If(n, 60, 40) + If(k, 8 + 520, 0) + 16
                          )
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =!(conAbsRoot.Width < 1024 && !IsBlank(varAbsSelId))
                      Children:
                        - conAbsListHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblAbsListTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Absences"
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorInk
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Bold
                                    Height: =30
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =80
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =20
                                    Text: ="Absences"
                                    Wrap: =false
                              - btnAbsReload:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Reload absences"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    DisplayMode: =If(varAbsLoading || varAbsSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnAbsLoadEngine)
                                    Size: =14
                                    Text: ="Reload"
                                    Tooltip: ="Reload absences"
                                    Width: =80
                              - btnAbsClearFilters:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Clear filters"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    DisplayMode: =If(varAbsSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varAbsCampusId, If(StudentCampusLock <> ZeroGuid, StudentCampusLock, !IsBlank(CurrentStaff.Campus), CurrentStaff.Campus.Campus, Coalesce(First(colAbsCampusOpts).CampusId, ZeroGuid)));
                                      Set(varAbsTeacherId, ZeroGuid);
                                      Set(varAbsStatus, "Not classified");
                                      Set(varAbsFrom, Coalesce(CurrentSchoolYear.'Start Date', Date(Year(Today()) - If(Month(Today()) < 7, 1, 0), 7, 1)));
                                      Set(varAbsTo, Today());
                                      Reset(ddAbsCampus); Reset(ddAbsTeacher); Reset(dpAbsFrom); Reset(dpAbsTo); Reset(rdoAbsStatus);
                                      Select(btnAbsLoadEngine)
                                    Size: =14
                                    Text: ="Clear filters"
                                    Width: =120
                        - conAbsScopeRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =58
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conAbsCampusField:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =140
                                  Children:
                                    - lblAbsCampus:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Campus"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorMuted
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Campus"
                                          Wrap: =false
                                    - ddAbsCampus:
                                        Control: ModernDropdown
                                        Properties:
                                          AccessibleLabel: ="Campus"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =Appearance.Outline
                                          Color: =ColorInk
                                          Default: =LookUp(colAbsCampusOpts, CampusId = varAbsCampusId)
                                          DisplayMode: =If(StudentCampusLock = ZeroGuid && !varAbsLoading && !varAbsSaving, DisplayMode.Edit, DisplayMode.Disabled)
                                          Height: =36
                                          ItemDisplayText: =ThisItem.CampusName
                                          Items: =colAbsCampusOpts
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: =Set(varAbsCampusId, Coalesce(Self.Selected.CampusId, ZeroGuid)); Set(varAbsTeacherId, ZeroGuid); Reset(ddAbsTeacher); Select(btnAbsLoadEngine)
                              - conAbsTeacherField:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =140
                                  Children:
                                    - lblAbsTeacher:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Teacher"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorMuted
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Teacher"
                                          Wrap: =false
                                    - ddAbsTeacher:
                                        Control: ModernDropdown
                                        Properties:
                                          AccessibleLabel: ="Teacher"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =Appearance.Outline
                                          Color: =ColorInk
                                          Default: =LookUp(colAbsTeacherOpts, TeacherId = varAbsTeacherId)
                                          Height: =36
                                          ItemDisplayText: =ThisItem.TeacherName
                                          Items: =Filter(colAbsTeacherOpts, TeacherId = ZeroGuid || CampusId = varAbsCampusId)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: =Set(varAbsTeacherId, Coalesce(Self.Selected.TeacherId, ZeroGuid)); Set(varAbsSelId, Blank())
                        - conAbsDateRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =58
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conAbsFromField:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =140
                                  Children:
                                    - lblAbsFrom:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="From date"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorMuted
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="From date"
                                          Wrap: =false
                                    - dpAbsFrom:
                                        Control: ModernDatePicker
                                        Properties:
                                          AccessibleLabel: ="From date"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =Appearance.Outline
                                          Color: =ColorInk
                                          DefaultDate: =varAbsFrom
                                          DisplayMode: =If(varAbsLoading || varAbsSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                          EndDate: =Today()
                                          Format: =DatePickerFormat.Short
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: =Set(varAbsFrom, Self.SelectedDate); Select(btnAbsLoadEngine)
                                          StartDate: =Date(FirstSchoolYear, 1, 1)
                              - conAbsToField:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =140
                                  Children:
                                    - lblAbsTo:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="To date"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorMuted
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="To date"
                                          Wrap: =false
                                    - dpAbsTo:
                                        Control: ModernDatePicker
                                        Properties:
                                          AccessibleLabel: ="To date"
