                            n = 0,
                            Set(varAbsReceipt, {Kind: "Blocked", Title: "Not saved. No absences ticked. Tick rows or use Select all shown."}); Clear(colAbsReceiptLines),
                            req.Kind = "Excused" && IsBlank(rsn),
