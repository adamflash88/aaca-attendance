Screens:
  AbsencesScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =Set(varAbsSaving, false);
        Set(varAbsMeSaving, false);
        Set(varAbsSelId, Blank());
        Set(varAbsReasonId, Blank());
        Set(varAbsReceipt, {Kind: "", Title: ""});
        Clear(colAbsReceiptLines);
        If(varAbsView <> "errors", Set(varAbsView, "classify"));
        If(StudentCampusLock <> ZeroGuid, Set(varAbsCampusId, StudentCampusLock));
        IfError(
            Concurrent(
                ClearCollect(colAbsCampusOpts, ForAll(Sort(Campuses, Name, SortOrder.Ascending) As c, {CampusId: c.Campus, CampusName: c.Name})),
                ClearCollect(colAbsTeacherSrc, ForAll(Sort(Filter(Staff, 'App Role' = 'App Role (Staff)'.Teacher), Name, SortOrder.Ascending) As t, {TeacherId: t.Staff, TeacherName: t.Name, CampusId: t.Campus.Campus})),
                ClearCollect(colAbsReasons, ForAll(Sort(Filter('Absence Reasons', Active = true), 'Sort Order', SortOrder.Ascending) As a, {ReasonId: a.'Absence Reason', ReasonName: a.Name, SortOrder: a.'Sort Order'}))
            ); true,
            Set(varAbsLoadError, FirstError.Message)
        );
        ClearCollect(colAbsTeacherOpts, {TeacherId: ZeroGuid, TeacherName: "All teachers", CampusId: ZeroGuid}, colAbsTeacherSrc);
        ClearCollect(colAbsMeCampusOpts, {CampusId: ZeroGuid, CampusName: "All campuses"}, colAbsCampusOpts);
        Select(btnAbsLoadEngine);
        Select(btnAbsMeEngine)
    Children:
      - conAbsRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conAbsHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conAbsRoot.Width < 640, 92, 76) + If(CanManageStudents, 48, 0) + If(CanClassify, 60, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(CanClassify, 0, 12)
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblAbsTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Attendance"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Attendance"
                        Wrap: =false
                  - lblAbsIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conAbsRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =0
                        Size: =12
                        Text: =Coalesce(CurrentUserRow.'Full Name', User().FullName) & " · " & RoleLabel & " · " & If(!StaffReady, "no campus", IsBlank(CurrentStaff.Campus), "All campuses", CurrentStaff.Campus.Name)
                        VerticalAlign: =VerticalAlign.Top
                  - conAbsNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(CanClassify, 52, 44)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =16
                        PaddingRight: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =CanManageStudents
                      Children:
                        - btnAbsNavAttendance:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Attendance"
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(Screen1)
                              Size: =14
                              Text: ="Attendance"
                              Width: =110
                        - btnAbsNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Width: =110
                        - btnAbsNavAbsences:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Absences (current screen)"
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(AbsencesScreen)
                              Size: =14
                              Text: ="Absences"
                              Width: =110
                  - conAbsHdrTabs:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =ColorPaper
                        FillPortions: =0
                        Height: =60
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =CanClassify
                      Children:
                        - btnAbsHdrClassify:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Classify absences" & If(varAbsView = "classify", " (current view)", "")
                              AlignInContainer: =If(conAbsRoot.Width < 640, AlignInContainer.Stretch, AlignInContainer.Center)
                              Appearance: =If(varAbsView = "classify", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =ColorTeal
                              Color: =If(varAbsView = "classify", ColorWhite, ColorInk)
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varAbsView, "classify")
                              Size: =14
                              Text: ="Classify absences"
                              Width: =If(conAbsRoot.Width < 640, Parent.Width - 32, 170)
                        - btnAbsHdrErrors:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =Self.Text & If(varAbsView = "errors", " (current view)", "")
                              AlignInContainer: =If(conAbsRoot.Width < 640, AlignInContainer.Stretch, AlignInContainer.Center)
                              Appearance: =If(varAbsView = "errors", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =ColorTeal
                              Color: =If(varAbsView = "errors", ColorWhite, ColorInk)
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varAbsView, "errors"); If(!varAbsMeLoaded && !varAbsMeLoading, Select(btnAbsMeEngine))
                              Size: =14
                              Text: ="Mapping Errors (" & If(varAbsMeLoaded, Text(CountRows(colAbsMe)), "…") & ")"
                              Width: =If(conAbsRoot.Width < 640, Parent.Width - 32, 220)
            - conAbsDenied:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + 24 + 8 + If(conAbsRoot.Width < 640, 88, 48) + 8 + 44 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!CanClassify
                Children:
                  - lblAbsDeniedTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Absences is not available for your role"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="Absences is not available for your role"
                        Wrap: =false
                  - lblAbsDeniedBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =If(conAbsRoot.Width < 640, 88, 48)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask a System Admin to set you up.", "Only the Attendance Office and System Admin roles classify absences. Teachers and Read-only users record and view attendance on the Attendance screen.")
                        VerticalAlign: =VerticalAlign.Top
                  - btnAbsDeniedBack:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Back to Attendance"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: =ButtonAppearance.Secondary
                        Color: =ColorInk
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Screen1)
                        Size: =14
                        Text: ="Back to Attendance"
                        Width: =190
            - conAbsMeView:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(conAbsMeReceipt.Visible, conAbsMeReceipt.Height + 8, 0) + conAbsMeBody.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =CanClassify && varAbsView = "errors"
                Children:
                  - conAbsMeReceipt:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =ColorRule
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =Switch(varAbsMeReceipt.Kind, "Failed", ColorErrorBg, "Blocked", ColorErrorBg, "Dismissed", ColorWarnBg, ColorInfoBg)
                        FillPortions: =0
                        Height: =8 + If(conAbsRoot.Width < 640, 84, 44) + If(varAbsMeReceipt.Body = "", 0, 4 + If(conAbsRoot.Width < 640, 300, 190)) + 8
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =varAbsMeReceipt.Kind <> ""
                      Children:
                        - conAbsMeReceiptTop:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(conAbsRoot.Width < 640, 84, 44)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblAbsMeReceiptTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorInk
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(conAbsRoot.Width < 640, 84, 44)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =varAbsMeReceipt.Title
                                    VerticalAlign: =VerticalAlign.Top
                              - btnAbsMeReceiptClose:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Close result"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varAbsMeReceipt, {Kind: "", Title: "", Body: ""})
                                    Size: =14
                                    Text: ="Close"
                                    Width: =88
                        - lblAbsMeReceiptBody:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorInk
                              Height: =If(conAbsRoot.Width < 640, 300, 190)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =varAbsMeReceipt.Body
                              VerticalAlign: =VerticalAlign.Top
                              Visible: =varAbsMeReceipt.Body <> ""
                  - conAbsMeBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(conAbsRoot.Width >= 1024, Max(conAbsMeListPanel.Height, conAbsMeDetail.Height), If(conAbsMeListPanel.Visible, conAbsMeListPanel.Height, 0) + If(conAbsMeListPanel.Visible && conAbsMeDetail.Visible, 8, 0) + If(conAbsMeDetail.Visible, conAbsMeDetail.Height, 0))
                        LayoutAlignItems: =If(conAbsRoot.Width >= 1024, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                        LayoutDirection: =If(conAbsRoot.Width >= 1024, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conAbsMeListPanel:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =If(conAbsRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                              BorderColor: =ColorRule
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorWhite
                              FillPortions: =If(conAbsRoot.Width >= 1024, 1, 0)
                              Height: |-
                                =With({nA: CountRows(Filter(colAbsMe, Kind = "A")), nB: CountRows(Filter(colAbsMe, Kind = "B"))}, 16 + 44 + 8 + 58 + 8 + If(conAbsRoot.Width < 640, 54, 36) + 8 + 24 + If(nA > 0, 8 + galAbsMeA.Height, 0) + 8 + 24 + If(nB > 0, 8 + galAbsMeB.Height, 0) + 16)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Visible: =!(conAbsRoot.Width < 1024 && !IsBlank(varAbsMeSelId))
                            Children:
                              - conAbsMeListHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblAbsMeListTitle:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =ColorInk
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Bold
                                          Height: =30
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =80
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =20
                                          Text: ="Mapping Errors (" & CountRows(colAbsMe) & ")"
                                          Wrap: =false
                                    - btnAbsMeReload:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Reload mapping errors"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Secondary
                                          Color: =ColorInk
                                          DisplayMode: =If(varAbsMeLoading || varAbsMeSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =44
                                          Layout: =ButtonLayout.TextOnly
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: =Select(btnAbsMeEngine)
                                          Size: =14
                                          Text: ="Reload"
                                          Width: =80
                              - conAbsMeCampusField:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =58
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblAbsMeCampus:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Campus"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorMuted
                                          FontWeight: =FontWeight.Semibold
                                          Height: =18
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: ="Campus"
                                          Wrap: =false
                                    - ddAbsMeCampus:
                                        Control: ModernDropdown
                                        Properties:
                                          AccessibleLabel: ="Campus for mapping errors"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =Appearance.Outline
                                          Color: =ColorInk
                                          Default: =LookUp(colAbsMeCampusOpts, CampusId = If(StudentCampusLock <> ZeroGuid, StudentCampusLock, varAbsMeCampusId))
                                          DisplayMode: =If(StudentCampusLock = ZeroGuid && !varAbsMeLoading && !varAbsMeSaving, DisplayMode.Edit, DisplayMode.Disabled)
                                          Height: =36
                                          ItemDisplayText: =ThisItem.CampusName
                                          Items: =colAbsMeCampusOpts
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(varAbsMeCampusId, Coalesce(Self.Selected.CampusId, ZeroGuid)); Set(varAbsMeReceipt, {Kind: "", Title: "", Body: ""}); Select(btnAbsMeEngine)
                              - lblAbsMeCount:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =If(varAbsMeLoadError <> "", ColorUnexcused, ColorInk)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(conAbsRoot.Width < 640, 54, 36)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: |-
                                      =If(
                                          varAbsMeLoadError <> "", "Could not load mapping errors: " & varAbsMeLoadError & ". Use Reload to try again.",
                                          varAbsMeLoading, "Loading mapping errors…",
                                          CountRows(colAbsMe) = 0, "No mapping errors. Website reports since " & Text(ParentReportCutover, "m/d/yyyy") & " all have a Student ID or a decision.",
                                          CountRows(Filter(colAbsMe, Kind = "A")) & " with no Student ID · " & CountRows(Filter(colAbsMe, Kind = "B")) & " could not be processed · " & If(StudentCampusLock <> ZeroGuid, "your campus", varAbsMeCampusId = ZeroGuid, "all campuses", LookUp(colAbsCampusOpts, CampusId = varAbsMeCampusId).CampusName) & If(CountRows(colAbsMeSrc) >= 2000, " · list may be incomplete (2,000-item limit)", "")
                                      )
                                    VerticalAlign: =VerticalAlign.Top
                              - lblAbsMeAHead:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorInk
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: ="No Student ID (" & CountRows(Filter(colAbsMe, Kind = "A")) & ")" & If(CountRows(Filter(colAbsMe, Kind = "A")) = 0, " · none", "")
                                    Wrap: =false
                              - galAbsMeA:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Reports with no Student ID"
                                    FillPortions: =0
                                    Height: =Min(3, CountRows(Filter(colAbsMe, Kind = "A"))) * If(conAbsRoot.Width < 640, 158, 140)
                                    Items: =SortByColumns(Filter(colAbsMe, Kind = "A"), "Created", SortOrder.Descending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Selectable: =false
                                    TabIndex: =0
                                    TemplatePadding: =0
                                    TemplateSize: =If(conAbsRoot.Width < 640, 158, 140)
                                    Visible: =CountRows(Filter(colAbsMe, Kind = "A")) > 0
                                  Children:
                                    - conAbsMeARow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =ColorRule
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =If(ThisItem.ItemId = varAbsMeSelId, ColorInfoBg, ColorWhite)
                                          Height: =Parent.TemplateHeight
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingBottom: =8
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =8
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.TemplateWidth - 16
                                        Children:
                                          - conAbsMeATop:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =44
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =8
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - lblAbsMeAName:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Color: =ColorInk
                                                      FillPortions: =1
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =42
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =14
                                                      Text: ="#" & ThisItem.ItemId & " · " & If(Trim(ThisItem.LastName & ThisItem.FirstName) = "", "(no name typed)", ThisItem.LastName & ", " & ThisItem.FirstName) & " (as typed)"
                                                      VerticalAlign: =VerticalAlign.Top
                                                - btnAbsMeAOpen:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: |-
                                                        ="Open report #" & ThisItem.ItemId
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =ButtonAppearance.Secondary
                                                      Color: =ColorInk
                                                      DisplayMode: =If(varAbsMeLoading || varAbsMeSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                                      Height: =44
                                                      Layout: =ButtonLayout.TextOnly
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =Set(varAbsMeSelId, ThisItem.ItemId);
