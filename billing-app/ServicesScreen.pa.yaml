Screens:
  ServicesScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =Set(varSvcSelId, Blank());
        Set(varSvcMode, "");
        Set(varSvcAliasDelId, Blank());
        Set(varSvcReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
        Set(varSvcAliasReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
        Reset(tglSvcInactive);
        Select(btnSvcLoadEngine)
    Children:
      - conSvcRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conSvcHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conSvcRoot.Width < 640, 92, 76) + If(IsFinance, 48, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblSvcTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Billing"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Billing"
                        Wrap: =false
                  - lblSvcIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conSvcRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =UserLabel & " · " & If(IsFinance, "Finance access", "No finance access")
                        VerticalAlign: =VerticalAlign.Top
                  - conSvcNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =IsFinance
                      Children:
                        - btnSvcNavHome:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Home"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(HomeScreen)
                              Size: =14
                              Text: ="Home"
                              Width: =110
                        - btnSvcNavFunders:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Funders"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(FundersScreen)
                              Size: =14
                              Text: ="Funders"
                              Width: =110
                        - btnSvcNavServices:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Services (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(ServicesScreen)
                              Size: =14
                              Text: ="Services"
                              Width: =110
                        - btnSvcNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Width: =110
                        - btnSvcNavRds:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to RDS Grid"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(RdsScreen)
                              Size: =14
                              Text: ="RDS Grid"
                              Width: =110
            - conSvcGate:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + 24 + 8 + 40 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!IsFinance
                Children:
                  - lblSvcGateTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="You don't have access to AACA Billing"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="You don't have access to AACA Billing"
                        Wrap: =false
                  - lblSvcGateBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask Adam Bernstein to set up Finance Access.", "AACA Billing is limited to the finance team. Ask Adam Bernstein if you need Finance Access.")
                        VerticalAlign: =VerticalAlign.Top
            - conSvcBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(conSvcRoot.Width >= 1024, Max(conSvcListPanel.Height, conSvcRight.Height), If(varSvcMode = "", conSvcListPanel.Height, conSvcRight.Height))
                  LayoutAlignItems: =If(conSvcRoot.Width >= 1024, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                  LayoutDirection: =If(conSvcRoot.Width >= 1024, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsFinance
                Children:
                  - conSvcListPanel:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =If(conSvcRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                        BorderColor: =ColorRule
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorWhite
                        FillPortions: =If(conSvcRoot.Width >= 1024, 1, 0)
                        Height: =668 + conSvcChips.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =!(conSvcRoot.Width < 1024 && varSvcMode <> "")
                      Children:
                        - conSvcListHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblSvcListTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Services"
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorInk
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =18
                                    Text: ="Services"
                                    Wrap: =false
                              - btnSvcReload:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Reload services"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Select(btnSvcLoadEngine)
                                    Size: =14
                                    Text: ="Reload"
                                    Width: =88
                              - btnSvcNew:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="New service"
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =ColorTeal
                                    Color: =ColorWhite
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |-
                                      =Set(varSvcSelId, Blank());
                                      Set(varSvcMode, "new");
                                      Set(varSvcAliasDelId, Blank());
                                      Set(varSvcReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
                                      Set(varSvcAliasReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
                                      Select(btnSvcFormResetEngine)
                                    Size: =14
                                    Text: ="New service"
                                    Width: =120
                        - conSvcChips:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(conSvcListPanel.Width - 32 >= 498, 44, conSvcListPanel.Width - 32 >= 280, 96, 148)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                            Children:
                              - btnSvcChipAll:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varSvcKind = "All", "All kinds (selected)", "Show all kinds")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varSvcKind = "All", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varSvcKind = "All", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varSvcKind, "All")
                                    Size: =14
                                    Text: ="All"
                                    Width: =64
                              - btnSvcChipSchool:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varSvcKind = "School Day", "School Day services (selected)", "Show School Day services")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varSvcKind = "School Day", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varSvcKind = "School Day", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varSvcKind, "School Day")
                                    Size: =14
                                    Text: ="School Day"
                                    Width: =110
                              - btnSvcChipClinical:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varSvcKind = "Clinical", "Clinical services (selected)", "Show Clinical services")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varSvcKind = "Clinical", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varSvcKind = "Clinical", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varSvcKind, "Clinical")
                                    Size: =14
                                    Text: ="Clinical"
                                    Width: =90
                              - btnSvcChipMissing:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varSvcMissingQbo, "Missing QuickBooks item filter (on)", "Show only services missing a QuickBooks item")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varSvcMissingQbo, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varSvcMissingQbo, ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |-
                                      =With({next: !varSvcMissingQbo}, Set(varSvcMissingQbo, next))
                                    Size: =14
                                    Text: ="Missing QuickBooks item"
                                    Width: =210
                        - conSvcFilterRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - tglSvcInactive:
                                  Control: ModernToggle
                                  Properties:
                                    AccessibleLabel: ="Show inactive services"
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =ColorTeal
                                    Color: =ColorInk
                                    Default: =varSvcShowInactive
                                    Height: =44
                                    Label: ="Show inactive"
                                    OnCheck: =Set(varSvcShowInactive, true)
                                    OnUncheck: =Set(varSvcShowInactive, false)
                                    Width: =160
                              - btnSvcClear:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Clear service filters"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |-
                                      =Set(varSvcKind, "All");
                                      Set(varSvcMissingQbo, false);
                                      Set(varSvcShowInactive, false);
                                      Reset(tglSvcInactive)
                                    Size: =14
                                    Text: ="Clear filters"
                                    Width: =120
                        - lblSvcCount:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorMuted
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =With(
                                    {
                                        n: CountRows(Filter(colServices, (varSvcShowInactive || IsActive) && (varSvcKind = "All" || KindText = varSvcKind) && (!varSvcMissingQbo || Trim(QboItem) = ""))),
                                        m: CountRows(Filter(colServices, varSvcShowInactive || IsActive))
                                    },
                                    If(
                                        varSvcLoading, "Loading services...",
                                        varSvcLoadError <> "", "Could not load services - " & varSvcLoadError,
                                        n = 0, "No services match these filters. Use Clear filters to see all.",
                                        "Showing " & n & " of " & m & " services"
                                    )
                                )
                              VerticalAlign: =VerticalAlign.Top
                        - galSvcList:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Services list"
                              FillPortions: =0
                              Height: =480
                              Items: |-
                                =Sort(
                                    Filter(
                                        colServices,
                                        (varSvcShowInactive || IsActive) &&
                                        (varSvcKind = "All" || KindText = varSvcKind) &&
                                        (!varSvcMissingQbo || Trim(QboItem) = "")
                                    ),
                                    KindRank * 100000 + Coalesce(SortNum, 9999),
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Selectable: =false
                              TabIndex: =0
                              TemplatePadding: =0
                              TemplateSize: =120
                            Children:
                              - conSvcRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =ColorRule
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.ServiceId = varSvcSelId, ColorInfoBg, ColorWhite)
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth - 16
                                  Children:
                                    - conSvcRowTop:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =44
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - lblSvcRowCode:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: ="Service " & ThisItem.Code & " - " & ThisItem.Name
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =ColorInk
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Semibold
                                                Height: =42
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: =ThisItem.Code & " - " & ThisItem.Name
                                          - btnSvcRowEdit:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Edit service " & ThisItem.Code
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =ButtonAppearance.Secondary
                                                Color: =ColorInk
                                                Height: =44
                                                Layout: =ButtonLayout.TextOnly
                                                OnSelect: |-
                                                  =Set(varSvcSelId, ThisItem.ServiceId);
                                                  Set(varSvcMode, "edit");
                                                  Set(varSvcAliasDelId, Blank());
                                                  Set(varSvcReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
                                                  Set(varSvcAliasReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
                                                  Select(btnSvcFormResetEngine)
                                                Size: =14
                                                Text: ="Edit"
                                                Width: =72
                                    - lblSvcRowMeta:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorInk
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =ThisItem.KindText & " · " & ThisItem.UnitText & If(ThisItem.NonSchool, " · Non-school days", "") & If(ThisItem.IsBillable, "", " · Not billable") & If(ThisItem.IsActive, "", " · Inactive") & If(IsBlank(ThisItem.SortNum), "", " · Sort " & ThisItem.SortNum)
                                          VerticalAlign: =VerticalAlign.Top
                                    - lblSvcRowQbo:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =If(Trim(ThisItem.QboItem) = "", ColorWarnInk, ColorMuted)
                                          FontWeight: =If(Trim(ThisItem.QboItem) = "", FontWeight.Semibold, FontWeight.Normal)
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =If(Trim(ThisItem.QboItem) = "", "No QuickBooks item", "QuickBooks item " & ThisItem.QboItem)
                                          Wrap: =false
                  - conSvcRight:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =If(conSvcRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                        DropShadow: =DropShadow.None
                        FillPortions: =If(conSvcRoot.Width >= 1024, 1, 0)
                        Height: =If(varSvcMode = "", If(conSvcRoot.Width >= 1024, 72, 0), conSvcForm.Height + If(varSvcMode = "edit", 12 + conSvcAliasPanel.Height, 0))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =varSvcMode <> "" || conSvcRoot.Width >= 1024
                      Children:
                        - conSvcPlaceholder:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorRule
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorWhite
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Visible: =varSvcMode = ""
                            Children:
                              - lblSvcPlaceholder:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Select Edit on a service, or New service to add one."
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Select Edit on a service, or New service to add one."
                                    VerticalAlign: =VerticalAlign.Top
                        - conSvcForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorRule
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorWhite
                              FillPortions: =0
                              Height: =756 + If(varSvcReceipt.Kind <> "", 6 + 16 + Max(44, 18 * RoundUp(Len(varSvcReceipt.Msg) / 45, 0) + 8), 0)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Visible: =varSvcMode <> ""
                            Children:
                              - conSvcReceipt:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =ColorRule
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =Switch(varSvcReceipt.Kind, "Failed", ColorErrorBg, "Blocked", ColorErrorBg, ColorInfoBg)
                                    FillPortions: =0
                                    Height: =16 + Max(44, 18 * RoundUp(Len(varSvcReceipt.Msg) / 45, 0) + 8)
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =8
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =8
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Visible: =varSvcReceipt.Kind <> ""
                                  Children:
                                    - lblSvcReceipt:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =varSvcReceipt.Msg
                                          AlignInContainer: =AlignInContainer.Start
                                          Color: =ColorInk
                                          FillPortions: =1
                                          Height: =18 * RoundUp(Len(varSvcReceipt.Msg) / 45, 0) + 8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =varSvcReceipt.Msg
                                          VerticalAlign: =VerticalAlign.Top
