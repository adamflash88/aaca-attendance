                                                    {hid: snap.AliasId, sCode: LookUp(colServices, ServiceId = snap.ServiceId).Code},
                                                    If(
                                                        !IsBlank(hid) && !varSvcSaving && IsFinance,
                                                        Set(varSvcSaving, true);
                                                        Set(varSvcErr, "");
