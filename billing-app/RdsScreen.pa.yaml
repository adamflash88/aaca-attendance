Screens:
  RdsScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: =Select(btnRdsLoadEngine)
    Children:
      - conRdsRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conRdsHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conRdsRoot.Width < 640, 92, 76) + If(IsFinance, 48, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblRdsTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Billing"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Billing"
                        Wrap: =false
                  - lblRdsIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conRdsRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =UserLabel & " · " & If(IsFinance, "Finance access", "No finance access")
                        VerticalAlign: =VerticalAlign.Top
                  - conRdsNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =IsFinance
                      Children:
                        - btnRdsNavHome:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Home"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(HomeScreen)
                              Size: =14
                              Text: ="Home"
                              Width: =110
                        - btnRdsNavFunders:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Funders"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(FundersScreen)
                              Size: =14
                              Text: ="Funders"
                              Width: =110
                        - btnRdsNavServices:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Services"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(ServicesScreen)
                              Size: =14
                              Text: ="Services"
                              Width: =110
                        - btnRdsNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Width: =110
                        - btnRdsNavRds:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="RDS Grid (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(RdsScreen)
                              Size: =14
                              Text: ="RDS Grid"
                              Width: =110
            - conRdsGate:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + 24 + 8 + 40 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!IsFinance
                Children:
                  - lblRdsGateTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="You don't have access to AACA Billing"
                        Wrap: =false
                  - lblRdsGateBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask Adam Bernstein to set up Finance Access.", "AACA Billing is limited to the finance team. Ask Adam Bernstein if you need Finance Access.")
                        VerticalAlign: =VerticalAlign.Top
            - conRdsPickers:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =10 + If(conRdsRoot.Width - 66 >= 1160, 66, conRdsRoot.Width - 66 >= 828, 144, 222) + 6 + 18 + 10
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =10
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =10
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =IsFinance
                Children:
                  - conRdsPickerRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(conRdsRoot.Width - 66 >= 1160, 66, conRdsRoot.Width - 66 >= 828, 144, 222)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                      Children:
                        - conRdsMonthField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =356
                            Children:
                              - lblRdsMonthCap:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Month"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Month"
                                    Wrap: =false
                              - conRdsMonthRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - btnRdsPrevMonth:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Previous month"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Secondary
                                          Color: =ColorInk
                                          DisplayMode: =If(varRdsLoading || IsBlank(varRdsMonth), DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =44
                                          Layout: =ButtonLayout.TextOnly
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varRdsMonth, Date(Year(varRdsMonth), Month(varRdsMonth) - 1, 1)); Select(btnRdsMonthEngine)
                                          Size: =14
                                          Text: ="Previous"
                                    - lblRdsMonth:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Selected month " & Self.Text
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =ColorInk
                                          FontWeight: =FontWeight.Semibold
                                          Height: =44
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Text: =If(IsBlank(varRdsMonth), "", Text(varRdsMonth, "mmmm yyyy"))
                                          Width: =140
                                          Wrap: =false
                                    - btnRdsNextMonth:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Next month"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Secondary
                                          Color: =ColorInk
                                          DisplayMode: =If(varRdsLoading || IsBlank(varRdsMonth), DisplayMode.Disabled, DisplayMode.Edit)
                                          Height: =44
                                          Layout: =ButtonLayout.TextOnly
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varRdsMonth, Date(Year(varRdsMonth), Month(varRdsMonth) + 1, 1)); Select(btnRdsMonthEngine)
                                          Size: =14
                                          Text: ="Next"
                        - conRdsFunderField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =460
                            Children:
                              - lblRdsFunderCap:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Funder"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Funder"
                                    Wrap: =false
                              - ddRdsFunder:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Funder"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    Default: =LookUp(colRdsFunderOpts, FunderId = varRdsFunderId)
                                    DisplayMode: =If(varRdsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    ItemDisplayText: =ThisItem.Abbr & " – " & ThisItem.FullName & " (" & ThisItem.TypeText & ")"
                                    Items: =colRdsFunderOpts
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =If(Coalesce(Self.Selected.FunderId, ZeroGuid) <> Coalesce(varRdsFunderId, ZeroGuid), Set(varRdsFunderId, Self.Selected.FunderId); Select(btnRdsGridEngine))
                                    Width: =Parent.Width
                        - conRdsStudentField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =66
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =320
                            Children:
                              - lblRdsStudentCap:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Student"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Student"
                                    Wrap: =false
                              - ddRdsStudent:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Student"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    Default: =LookUp(colRdsStudentOpts, StudentId = varRdsStudentId)
                                    DisplayMode: =If(varRdsLoading || IsBlank(varRdsFunderId), DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    ItemDisplayText: =ThisItem.DisplayName & " (" & ThisItem.StudentKey & ")"
                                    Items: =colRdsStudentOpts
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =If(Coalesce(Self.Selected.StudentId, ZeroGuid) <> Coalesce(varRdsStudentId, ZeroGuid), Set(varRdsStudentId, Self.Selected.StudentId); Select(btnRdsGridEngine))
                                    Width: =Parent.Width
                  - lblRdsStatus:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =If(varRdsLoadError <> "", ColorUnexcused, varRdsPageCapped, ColorWarnInk, ColorMuted)
                        Height: =18
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          =If(
                              varRdsLoading, "Loading...",
                              varRdsLoadError <> "", "Could not load - " & varRdsLoadError,
                              varRdsPageCapped, "Warning: a day returned 500 or more deliveries, so the funder and student lists may be incomplete. Tell Adam.",
                              Text(CountRows(colRdsFunderOpts)) & " funders · " & Text(CountRows(colRdsMonthPairs), "#,##0") & " deliveries in " & Text(varRdsMonth, "mmmm yyyy")
                          )
                        VerticalAlign: =VerticalAlign.Top
            - conRdsEmpty:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =IsFinance && (IsBlank(varRdsFunderId) || IsBlank(varRdsStudentId))
                Children:
                  - lblRdsEmptyText:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: |-
                          =With({mn: Text(varRdsMonth, "mmmm yyyy")},
                              If(
                                  varRdsLoading, "Loading...",
                                  CountRows(colRdsFunderOpts) = 0, "No funders have deliveries, districts of record or student services in " & mn & ". Try another month.",
                                  IsBlank(varRdsFunderId), "Choose a funder to see its students for " & mn & ".",
                                  CountRows(colRdsStudentOpts) = 0, "No students have anything for this funder in " & mn & ".",
                                  "Choose a student to show the Register of Daily Services."
                              )
                          )
                        VerticalAlign: =VerticalAlign.Top
            - conRdsDoc:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: |-
                    =16 + 76 + 12 + If(CountRows(colRdsRows) = 0, 40, 58 + Min(880, 36 * CountRows(colRdsRows))) + 12 +
                     If(conRdsRoot.Width - 66 >= 1004, 28, conRdsRoot.Width - 66 >= 560, 64, 100) + 206 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =IsFinance && !IsBlank(varRdsFunderId) && !IsBlank(varRdsStudentId)
                Children:
                  - conRdsDocHead:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =76
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - lblRdsDocTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorInk
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =20
                              Text: |-
                                =With({s: LookUp(colStudents, StudentId = varRdsStudentId)}, "Register of Daily Services  ·  " & s.DisplayName & " (" & s.StudentKey & ")")
                              Wrap: =false
                        - lblRdsDocStudent:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorInk
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: |-
                                =With({s: LookUp(colStudents, StudentId = varRdsStudentId)}, s.DisplayName & " (" & s.StudentKey & ")")
                              Visible: =false
                              Wrap: =false
                        - lblRdsDocMeta1:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorInk
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |-
                                =With({f: LookUp(colFunders, FunderId = varRdsFunderId)}, "Funder: " & f.Abbr & " – " & f.FullName & " (" & f.TypeText & ")   ·   Month: " & Text(varRdsMonth, "mmmm yyyy"))
                              VerticalAlign: =VerticalAlign.Top
                        - lblRdsDocMeta2:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorInk
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |-
                                =With(
                                    {
                                        s: LookUp(colStudents, StudentId = varRdsStudentId),
                                        dors: SortByColumns(Filter(colDor, StudentId = varRdsStudentId && StartDate <= varRdsMonthEnd && Coalesce(EndDate, FarFuture) >= varRdsMonth), "StartDate", SortOrder.Ascending)
                                    },
                                    "Campus: " & varRdsCampusText & "   ·   District of record: " &
                                    If(
                                        s.TypeText = "Regional Center Only", "None (Regional Center Only)",
                                        CountRows(dors) = 0, "None on file for this month",
                                        Concat(dors As d, LookUp(colFunders, FunderId = d.FunderId).Abbr & " " & Text(d.StartDate, "m/d/yyyy") & " to " & If(IsBlank(d.EndDate), "ongoing", Text(d.EndDate, "m/d/yyyy")), "; ")
                                    )
                                )
                              VerticalAlign: =VerticalAlign.Top
                  - lblRdsNoRows:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: |-
                          =If(varRdsLoading, "Loading grid...", "No rows for this student, funder and month: no attendance or day-service rows apply and no services were delivered.")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =CountRows(colRdsRows) = 0
                  - conRdsGridScroll:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =58 + Min(880, 36 * Max(1, CountRows(colRdsRows)))
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowX: =LayoutOverflow.Scroll
                        Visible: =CountRows(colRdsRows) > 0
                      Children:
                        - conRdsGridInner:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderColor: =ColorGrid
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42 + Min(880, 36 * Max(1, CountRows(colRdsRows)))
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Max(Parent.Width, 330 + 30 * CountRows(colRdsDays))
                            Children:
                              - conRdsGridHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =ColorGrid
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =1
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =1
                                  Children:
                                    - lblRdsHeadLabel:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Service column"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorInk
                                          Fill: =ColorPaper
                                          FontWeight: =FontWeight.Bold
                                          Height: =39
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =4
                                          PaddingLeft: =6
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: ="Service"
                                          VerticalAlign: =VerticalAlign.Bottom
                                          Width: =220
                                          Wrap: =false
                                    - galRdsDayHead:
                                        Control: Gallery
                                        Variant: Horizontal
                                        Properties:
                                          AccessibleLabel: ="Days of the month"
                                          Fill: =ColorGrid
                                          FillPortions: =0
