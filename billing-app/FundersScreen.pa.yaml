Screens:
  FundersScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =Set(varFunSelId, Blank());
        Set(varFunMode, "");
        Set(varFunAliasDelId, Blank());
        Set(varFunReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
        Set(varFunAliasReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
        Reset(txtFunSearch);
        Reset(tglFunInactive);
        Select(btnFunLoadEngine)
    Children:
      - conFunRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conFunHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conFunRoot.Width < 640, 92, 76) + If(IsFinance, 48, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblFunTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Billing"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Billing"
                        Wrap: =false
                  - lblFunIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =UserLabel & " · " & If(IsFinance, "Finance access", "No finance access")
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conFunRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =UserLabel & " · " & If(IsFinance, "Finance access", "No finance access")
                        VerticalAlign: =VerticalAlign.Top
                  - conFunNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =IsFinance
                      Children:
                        - btnFunNavHome:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Home"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(HomeScreen)
                              Size: =14
                              Text: ="Home"
                              Width: =110
                        - btnFunNavFunders:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Funders (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(FundersScreen)
                              Size: =14
                              Text: ="Funders"
                              Width: =110
                        - btnFunNavServices:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Services"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(ServicesScreen)
                              Size: =14
                              Text: ="Services"
                              Width: =110
                        - btnFunNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Students"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Width: =110
                        - btnFunNavRds:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to RDS Grid"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(RdsScreen)
                              Size: =14
                              Text: ="RDS Grid"
                              Width: =110
            - conFunGate:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + 24 + 8 + 40 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!IsFinance
                Children:
                  - lblFunGateTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="You don't have access to AACA Billing"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="You don't have access to AACA Billing"
                        Wrap: =false
                  - lblFunGateBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask Adam Bernstein to set up Finance Access.", "AACA Billing is limited to the finance team. Ask Adam Bernstein if you need Finance Access.")
                        VerticalAlign: =VerticalAlign.Top
            - conFunBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(conFunRoot.Width >= 1024, Max(conFunListPanel.Height, conFunRight.Height), If(varFunMode = "", conFunListPanel.Height, conFunRight.Height))
                  LayoutAlignItems: =If(conFunRoot.Width >= 1024, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                  LayoutDirection: =If(conFunRoot.Width >= 1024, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsFinance
                Children:
                  - conFunListPanel:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =If(conFunRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                        BorderColor: =ColorRule
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorWhite
                        FillPortions: =If(conFunRoot.Width >= 1024, 1, 0)
                        Height: =738 + conFunChips.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =!(conFunRoot.Width < 1024 && varFunMode <> "")
                      Children:
                        - conFunListHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblFunListTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Funders"
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorInk
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =80
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =18
                                    Text: ="Funders"
                                    Wrap: =false
                              - btnFunReload:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Reload funders"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    DisplayMode: =If(varFunLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Select(btnFunLoadEngine)
                                    Size: =14
                                    Text: ="Reload"
                                    Width: =88
                              - btnFunNew:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="New funder"
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =ColorTeal
                                    Color: =ColorWhite
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |-
                                      =Set(varFunSelId, Blank());
                                      Set(varFunMode, "new");
                                      Set(varFunAliasDelId, Blank());
                                      Set(varFunReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
                                      Set(varFunAliasReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
                                      Select(btnFunFormResetEngine)
                                    Size: =14
                                    Text: ="New funder"
                                    Width: =120
                        - lblFunSearch:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Search abbreviation, name or alias"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorMuted
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Search abbreviation, name or alias"
                              Wrap: =false
                        - txtFunSearch:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Search funders by abbreviation, name or alias"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              Color: =ColorInk
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: ="e.g. LAUSD or Los Angeles"
                              TriggerOutput: =TriggerOutput.Delayed
                              Type: =TextInputType.Search
                        - conFunChips:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(conFunListPanel.Width - 32 >= 702, 44, conFunListPanel.Width - 32 >= 454, 96, 148)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                            Children:
                              - btnFunChipAll:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Show all funder types" & If(varFunType = "All", " (selected)", "")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varFunType = "All", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varFunType = "All", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varFunType, "All")
                                    Size: =14
                                    Text: ="All"
                                    Width: =64
                              - btnFunChipDistrict:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Show District funders" & If(varFunType = "District", " (selected)", "")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varFunType = "District", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varFunType = "District", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varFunType, "District")
                                    Size: =14
                                    Text: ="District"
                              - btnFunChipRc:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Show Regional Center funders" & If(varFunType = "Regional Center", " (selected)", "")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varFunType = "Regional Center", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varFunType = "Regional Center", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varFunType, "Regional Center")
                                    Size: =14
                                    Text: ="Regional Center"
                                    Width: =150
                              - btnFunChipPp:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Show Private Pay funders" & If(varFunType = "Private Pay", " (selected)", "")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varFunType = "Private Pay", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varFunType = "Private Pay", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varFunType, "Private Pay")
                                    Size: =14
                                    Text: ="Private Pay"
                                    Width: =120
                              - btnFunChipMissing:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Only funders missing a QuickBooks customer" & If(varFunMissingQbo, " (on)", " (off)")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varFunMissingQbo, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varFunMissingQbo, ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |-
                                      =With({next: !varFunMissingQbo}, Set(varFunMissingQbo, next))
                                    Size: =14
                                    Text: ="Missing QuickBooks customer"
                                    Width: =240
                        - conFunFilterRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - tglFunInactive:
                                  Control: ModernToggle
                                  Properties:
                                    AccessibleLabel: ="Show inactive funders"
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorInk
                                    Default: =varFunShowInactive
                                    Height: =44
                                    Label: ="Show inactive"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnCheck: =Set(varFunShowInactive, true)
                                    OnUncheck: =Set(varFunShowInactive, false)
                                    Width: =160
                              - btnFunClear:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Clear all funder filters"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |-
                                      =Set(varFunType, "All");
                                      Set(varFunMissingQbo, false);
                                      Set(varFunShowInactive, false);
                                      Reset(txtFunSearch);
                                      Reset(tglFunInactive)
                                    Size: =14
                                    Text: ="Clear filters"
                                    Width: =120
                        - lblFunCount:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =If(varFunLoadError <> "", ColorUnexcused, ColorMuted)
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =With(
                                    {
                                        n: CountRows(
                                            Filter(
                                                colFunders As f,
                                                (varFunShowInactive || f.IsActive) &&
                                                (varFunType = "All" || f.TypeText = varFunType) &&
                                                (!varFunMissingQbo || Trim(f.QboCustomer) = "") &&
                                                (Trim(txtFunSearch.Text) = "" ||
                                                    Lower(Trim(txtFunSearch.Text)) in Lower(f.Abbr & " " & f.FullName) ||
                                                    CountIf(colFunderAliases, FunderId = f.FunderId && Lower(Trim(txtFunSearch.Text)) in Lower(AliasText)) > 0)
                                            )
                                        ),
                                        m: CountRows(Filter(colFunders, varFunShowInactive || IsActive))
                                    },
                                    If(
                                        varFunLoading, "Loading funders...",
                                        varFunLoadError <> "", "Could not load funders - " & varFunLoadError,
                                        n = 0, "No funders match these filters. Use Clear filters to see all.",
                                        "Showing " & n & " of " & m & " funders"
                                    )
                                )
                              VerticalAlign: =VerticalAlign.Top
                        - galFunList:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Funders list"
                              FillPortions: =0
                              Height: =480
                              Items: |-
                                =Sort(
                                    Filter(
                                        colFunders As f,
                                        (varFunShowInactive || f.IsActive) &&
                                        (varFunType = "All" || f.TypeText = varFunType) &&
                                        (!varFunMissingQbo || Trim(f.QboCustomer) = "") &&
                                        (Trim(txtFunSearch.Text) = "" ||
                                            Lower(Trim(txtFunSearch.Text)) in Lower(f.Abbr & " " & f.FullName) ||
                                            CountIf(colFunderAliases, FunderId = f.FunderId && Lower(Trim(txtFunSearch.Text)) in Lower(AliasText)) > 0)
                                    ),
                                    Abbr,
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Selectable: =false
                              TabIndex: =0
                              TemplatePadding: =0
                              TemplateSize: =120
                            Children:
                              - conFunRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =ColorRule
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.FunderId = varFunSelId, ColorInfoBg, ColorWhite)
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth - 16
                                  Children:
                                    - conFunRowTop:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =44
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - lblFunRowAbbr:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: ="Funder " & ThisItem.Abbr
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =ColorInk
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: =ThisItem.Abbr
                                                Wrap: =false
                                          - btnFunRowEdit:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Edit funder " & ThisItem.Abbr
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =ButtonAppearance.Secondary
                                                Color: =ColorInk
                                                Height: =44
                                                Layout: =ButtonLayout.TextOnly
                                                OnSelect: |-
                                                  =Set(varFunSelId, ThisItem.FunderId);
                                                  Set(varFunMode, "edit");
                                                  Set(varFunAliasDelId, Blank());
                                                  Set(varFunReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
                                                  Set(varFunAliasReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid});
                                                  Select(btnFunFormResetEngine)
                                                Size: =14
                                                Text: ="Edit"
                                                Width: =72
                                    - lblFunRowName:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =ColorInk
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =ThisItem.FullName & " · " & ThisItem.TypeText & If(ThisItem.IsActive, "", " · Inactive") & " · " & CountIf(colFunderAliases, FunderId = ThisItem.FunderId) & " aliases"
                                          VerticalAlign: =VerticalAlign.Top
                                    - lblFunRowQbo:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =If(Trim(ThisItem.QboCustomer) = "", ColorWarnInk, ColorInk)
                                          FontWeight: =If(Trim(ThisItem.QboCustomer) = "", FontWeight.Semibold, FontWeight.Normal)
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: =If(Trim(ThisItem.QboCustomer) = "", "No QuickBooks customer", "QuickBooks customer " & ThisItem.QboCustomer)
                                          Wrap: =false
                  - conFunRight:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =If(conFunRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                        DropShadow: =DropShadow.None
                        FillPortions: =If(conFunRoot.Width >= 1024, 1, 0)
                        Height: =If(varFunMode = "", If(conFunRoot.Width >= 1024, 72, 0), conFunForm.Height + If(varFunMode = "edit", 12 + conFunAliasPanel.Height, 0))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =varFunMode <> "" || conFunRoot.Width >= 1024
                      Children:
                        - conFunPlaceholder:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorRule
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorWhite
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Visible: =varFunMode = ""
                            Children:
                              - lblFunPlaceholder:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Select Edit on a funder, or New funder to add one."
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Select Edit on a funder, or New funder to add one."
                                    VerticalAlign: =VerticalAlign.Top
                        - conFunForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorRule
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorWhite
