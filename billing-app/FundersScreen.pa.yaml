            - btnFunFormResetEngine:
                Control: Classic/Button
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoDisableOnSelect: =false
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =Reset(txtFunAbbr); Reset(txtFunFull); Reset(rdoFunType); Reset(txtFunQbo); Reset(tglFunActive); Reset(txtFunAliasNew)
                  Text: ="reset"
                  Visible: =false
            - btnFunLoadEngine:
                Control: Classic/Button
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoDisableOnSelect: =false
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Set(varFunLoading, true);
                    Set(varFunLoadError, "");
                    If(
                        !IsFinance,
                        Clear(colFunders); Clear(colFunderAliases),
                        IfError(
                            Refresh(Funders); Refresh('Funder Aliases');
                            Concurrent(
                                ClearCollect(colFunders, ForAll(Funders As f, {FunderId: f.Funder, Abbr: Coalesce(f.Abbreviation, ""), FullName: Coalesce(f.'Full Name', ""), TypeText: Coalesce(Text(f.'Funder Type'), ""), QboCustomer: Coalesce(f.'QuickBooks Customer', ""), IsActive: Coalesce(f.Active, false)})),
                                ClearCollect(colFunderAliases, ForAll('Funder Aliases' As a, {AliasId: a.'Funder Alias', AliasText: Coalesce(a.'CodeMetro Name', ""), FunderId: a.Funder.Funder}))
                            );
                            true,
                            Set(varFunLoadError, FirstError.Message);
                            false
                        )
                    );
                    Set(varFunLoading, false)
                  Text: ="load"
                  Visible: =false
