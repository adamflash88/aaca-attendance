                                                            IfError(Set(varFunLastAlias, Patch('Funder Aliases', LookUp('Funder Aliases', 'Funder Alias' = hid), {Funder: LookUp(Funders, Funder = fid)})); true, Set(varFunErr, FirstError.Message); false);
