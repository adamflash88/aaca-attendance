Screens:
  StudentsScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: |-
        =Set(varStuSelId, Blank()); Set(varStuDorMode, ""); Set(varStuSsMode, ""); Set(varStuDorEditId, Blank()); Set(varStuSsEditId, Blank()); Set(varStuDorDelId, Blank()); Set(varStuSsDelId, Blank()); Set(varStuDorReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid}); Set(varStuSsReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid}); Reset(txtStuSearch); Select(btnStuLoadEngine)
    Children:
      - conStuRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =ColorPaper
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            Width: =Parent.Width
          Children:
            - conStuHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorInk
                  FillPortions: =0
                  Height: =If(conStuRoot.Width < 640, 92, 76) + If(IsFinance, 48, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                Children:
                  - lblStuTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="AACA Billing"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorWhite
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: ="AACA Billing"
                        Wrap: =false
                  - lblStuIdentity:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInkSoft
                        Height: =If(conStuRoot.Width < 640, 36, 20)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: =UserLabel & " · " & If(IsFinance, "Finance access", "No finance access")
                        VerticalAlign: =VerticalAlign.Top
                  - conStuNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =IsFinance
                      Children:
                        - btnStuNavHome:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Home"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(HomeScreen)
                              Size: =14
                              Text: ="Home"
                              Width: =110
                        - btnStuNavFunders:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Funders"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(FundersScreen)
                              Size: =14
                              Text: ="Funders"
                              Width: =110
                        - btnStuNavServices:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to Services"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(ServicesScreen)
                              Size: =14
                              Text: ="Services"
                              Width: =110
                        - btnStuNavStudents:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Students (current screen)"
                              AlignInContainer: =AlignInContainer.Center
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(StudentsScreen)
                              Size: =14
                              Text: ="Students"
                              Width: =110
                        - btnStuNavRds:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to RDS Grid"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Navigate(RdsScreen)
                              Size: =14
                              Text: ="RDS Grid"
                              Width: =110
            - conStuGate:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorWhite
                  FillPortions: =0
                  Height: =16 + 24 + 8 + 40 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =!IsFinance
                Children:
                  - lblStuGateTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =16
                        Text: ="You don't have access to AACA Billing"
                        Wrap: =false
                  - lblStuGateBody:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =ColorInk
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask Adam Bernstein to set up Finance Access.", "AACA Billing is limited to the finance team. Ask Adam Bernstein if you need Finance Access.")
                        VerticalAlign: =VerticalAlign.Top
            - conStuBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(conStuRoot.Width >= 1024, Max(conStuListPanel.Height, conStuRight.Height), If(IsBlank(varStuSelId), conStuListPanel.Height, conStuRight.Height))
                  LayoutAlignItems: =If(conStuRoot.Width >= 1024, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                  LayoutDirection: =If(conStuRoot.Width >= 1024, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsFinance
                Children:
                  - conStuListPanel:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =If(conStuRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                        BorderColor: =ColorRule
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =ColorWhite
                        FillPortions: =If(conStuRoot.Width >= 1024, 1, 0)
                        Height: =694 + conStuChips.Height + conStuStatusRow.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =!(conStuRoot.Width < 1024 && !IsBlank(varStuSelId))
                      Children:
                        - conStuListHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblStuListTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Student billing setup"
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorInk
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =18
                                    Text: ="Student billing setup"
                                    Wrap: =false
                              - btnStuReload:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Reload students, districts of record and service rows"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    DisplayMode: =If(varStuLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Select(btnStuLoadEngine)
                                    Size: =14
                                    Text: ="Reload"
                                    Width: =88
                        - lblStuSearch:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Search name or student key"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorMuted
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Search name or student key"
                              Wrap: =false
                        - txtStuSearch:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="Search students by name or student key"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =Appearance.Outline
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: ="e.g. Garcia or CW-1083"
                              TriggerOutput: =TriggerOutput.Delayed
                              Type: =TextInputType.Search
                        - conStuChips:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(conStuListPanel.Width - 32 >= 542, 44, conStuListPanel.Width - 32 >= 344, 96, 148)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                            Children:
                              - btnStuChipAll:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varStuType = "All", "All student types (selected)", "Show all student types")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varStuType = "All", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varStuType = "All", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varStuType, "All")
                                    Size: =14
                                    Text: ="All"
                                    Width: =64
                              - btnStuChipSchool:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varStuType = "School", "School students (selected)", "Show School students only")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varStuType = "School", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varStuType = "School", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varStuType, "School")
                                    Size: =14
                                    Text: ="School"
                                    Width: =84
                              - btnStuChipRc:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varStuType = "Regional Center Only", "Regional Center Only students (selected)", "Show Regional Center Only students")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varStuType = "Regional Center Only", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varStuType = "Regional Center Only", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varStuType, "Regional Center Only")
                                    Size: =14
                                    Text: ="Regional Center Only"
                                    Width: =180
                              - btnStuChipNoDor:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varStuNoDor, "Only students with no district of record (on)", "Show only students with no district of record")
                                    AlignInContainer: =AlignInContainer.Start
                                    Appearance: =If(varStuNoDor, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varStuNoDor, ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |-
                                      =With({next: !varStuNoDor}, Set(varStuNoDor, next))
                                    Size: =14
                                    Text: ="No district of record"
                                    Width: =190
                        - conStuStatusRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(conStuListPanel.Width - 32 >= 396, 44, 96)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                            Children:
                              - lblStuStatus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Status filter"
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorMuted
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: ="Status"
                                    Width: =52
                                    Wrap: =false
                              - btnStuStatusActive:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varStuStatus = "Active", "Active students only (selected)", "Show active students only")
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =If(varStuStatus = "Active", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varStuStatus = "Active", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varStuStatus, "Active")
                                    Size: =14
                                    Text: ="Active"
                                    Width: =80
                              - btnStuStatusAll:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varStuStatus = "All", "All statuses (selected)", "Show students of all statuses")
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =If(varStuStatus = "All", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                                    BasePaletteColor: =ColorTeal
                                    Color: =If(varStuStatus = "All", ColorWhite, ColorInk)
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varStuStatus, "All")
                                    Size: =14
                                    Text: ="All statuses"
                                    Width: =120
                              - btnStuClear:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Clear student filters and search"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: =Set(varStuType, "All"); Set(varStuNoDor, false); Set(varStuStatus, "Active"); Reset(txtStuSearch)
                                    Size: =14
                                    Text: ="Clear filters"
                                    Width: =120
                        - lblStuCount:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =ColorMuted
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =With(
                                    {
                                        n: CountRows(
                                            Filter(
                                                colStudents As s,
                                                (varStuStatus = "All" || s.StatusText = "Active") &&
                                                (varStuType = "All" || s.TypeText = varStuType) &&
                                                (!varStuNoDor || (s.TypeText = "School" && CountIf(colDor, StudentId = s.StudentId && StartDate <= Today() && (IsBlank(EndDate) || EndDate >= Today())) = 0)) &&
                                                (Trim(txtStuSearch.Text) = "" || Lower(Trim(txtStuSearch.Text)) in Lower(s.DisplayName & " " & s.StudentKey))
                                            )
                                        ),
                                        m: CountRows(colStudents)
                                    },
                                    If(
                                        varStuLoading, "Loading students...",
                                        varStuLoadError <> "", "Could not load students - " & varStuLoadError,
                                        n = 0, "No students match these filters. Use Clear filters to see all.",
                                        "Showing " & n & " of " & m & " students"
                                    )
                                )
                              VerticalAlign: =VerticalAlign.Top
                        - galStuList:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Filtered student list"
                              FillPortions: =0
                              Height: =480
                              Items: |-
                                =Sort(
                                    Filter(
                                        colStudents As s,
                                        (varStuStatus = "All" || s.StatusText = "Active") &&
                                        (varStuType = "All" || s.TypeText = varStuType) &&
                                        (!varStuNoDor || (s.TypeText = "School" && CountIf(colDor, StudentId = s.StudentId && StartDate <= Today() && (IsBlank(EndDate) || EndDate >= Today())) = 0)) &&
                                        (Trim(txtStuSearch.Text) = "" || Lower(Trim(txtStuSearch.Text)) in Lower(s.DisplayName & " " & s.StudentKey))
                                    ),
                                    DisplayName,
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Selectable: =false
                              TabIndex: =0
                              TemplatePadding: =0
                              TemplateSize: =100
                            Children:
                              - conStuRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =ColorRule
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.StudentId = varStuSelId, ColorInfoBg, ColorWhite)
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Width: =Parent.TemplateWidth - 16
                                  Children:
                                    - conStuRowTop:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =44
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - lblStuRowName:
                                              Control: ModernText
                                              Properties:
                                                AccessibleLabel: =ThisItem.StudentKey & " - " & ThisItem.DisplayName
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =ColorInk
                                                FillPortions: =1
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =14
                                                Text: =ThisItem.StudentKey & " - " & ThisItem.DisplayName
                                                Wrap: =false
                                          - btnStuRowOpen:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Open billing setup for " & ThisItem.DisplayName
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =ButtonAppearance.Secondary
                                                Color: =ColorInk
                                                Height: =44
                                                Layout: =ButtonLayout.TextOnly
                                                OnSelect: |-
                                                  =Set(varStuSelId, ThisItem.StudentId); Set(varStuDorMode, ""); Set(varStuSsMode, ""); Set(varStuDorEditId, Blank()); Set(varStuSsEditId, Blank()); Set(varStuDorDelId, Blank()); Set(varStuSsDelId, Blank()); Set(varStuDorReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid}); Set(varStuSsReceipt, {Kind: "", Msg: "", RecordId: ZeroGuid})
                                                Size: =14
                                                Text: ="Open"
                                                Width: =72
                                    - lblStuRowMeta:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =If(ThisItem.TypeText = "School" && CountIf(colDor, StudentId = ThisItem.StudentId && StartDate <= Today() && (IsBlank(EndDate) || EndDate >= Today())) = 0, ColorWarnInk, ColorInk)
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: |-
                                            =With(
                                                {
                                                    d: First(Filter(colDor, StudentId = ThisItem.StudentId && StartDate <= Today() && (IsBlank(EndDate) || EndDate >= Today()))),
                                                    k: CountIf(colStuSvc, StudentId = ThisItem.StudentId && !IsExcluded && StartDate <= Today() && (IsBlank(EndDate) || EndDate >= Today()))
                                                },
                                                ThisItem.TypeText & If(ThisItem.StatusText = "Active", "", " · " & ThisItem.StatusText) & " · " &
                                                If(ThisItem.TypeText = "Regional Center Only", "No district needed", IsBlank(d), "No district of record", "District " & LookUp(colFunders, FunderId = d.FunderId).Abbr) &
                                                " · " & k & If(k = 1, " active day service", " active day services")
                                            )
                                          VerticalAlign: =VerticalAlign.Top
                  - conStuRight:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =If(conStuRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                        DropShadow: =DropShadow.None
                        FillPortions: =If(conStuRoot.Width >= 1024, 1, 0)
                        Height: |-
                          =If(
                              IsBlank(varStuSelId),
                              If(conStuRoot.Width >= 1024, 72, 0),
                              96 + 12 + conStuDor.Height +
                              If(varStuDorMode <> "" && LookUp(colStudents, StudentId = varStuSelId).TypeText <> "Regional Center Only", 12 + 470, 0) +
                              12 + conStuSs.Height +
                              If(varStuSsMode <> "", 12 + 768, 0)
                          )
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =!IsBlank(varStuSelId) || conStuRoot.Width >= 1024
                      Children:
                        - conStuPlaceholder:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorRule
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorWhite
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Visible: =IsBlank(varStuSelId)
                            Children:
                              - lblStuPlaceholder:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =ColorMuted
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="Select Open on a student to see their district of record and service rows."
                                    VerticalAlign: =VerticalAlign.Top
                        - conStuHead:
