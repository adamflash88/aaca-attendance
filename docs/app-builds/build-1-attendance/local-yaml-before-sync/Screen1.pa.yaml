                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - galAttDayList:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Visible: =CountRows(Filter(colMonthCells, DayNum = Day(varViewDate) && (State = "Open" || State = "Future"))) > 0
                        Items: |-
                          =ForAll(
                              Filter(colMonthCells, DayNum = Day(varViewDate) && (State = "Open" || State = "Future")) As c,
                              With(
                                  {
                                      a: LookUp(colMonthAtt, StudentId = c.StudentId && DayNum = c.DayNum && !IsDeleted),
                                      s: LookUp(colCellState, StudentId = c.StudentId && DayNum = c.DayNum)
                                  },
                                  {
                                      StudentId: c.StudentId,
                                      StudentName: c.StudentName,
                                      DayNum: c.DayNum,
                                      CellDate: c.CellDate,
                                      State: c.State,
                                      Reason: c.Reason,
                                      HasRecord: !IsBlank(a),
                                      Letter: Coalesce(a.Letter, ""),
                                      SaveState: Coalesce(s.SaveState, ""),
                                      Target: Coalesce(s.Target, ""),
                                      Editable: varCanEditMonth && c.State = "Open",
                                      Actionable: If(varDetailsMode, !IsBlank(a), varCanEditMonth && c.State = "Open"),
                                      StatusWord: If(
                                          Coalesce(s.SaveState, "") = "failed", "Save failed – tap to retry",
                                          Coalesce(s.SaveState, "") = "saving", "Saving",
                                          !IsBlank(a), Switch(a.Letter, "P", "Present", "E", "Absent, excused", "U", "Absent, unexcused", "Absent, not classified"),
                                          c.State = "NotEnrolled", "Not enrolled",
                                          c.State = "NonSchool", "Not a school day",
                                          c.State = "Future", "Future date",
                                          "Not recorded"
                                      )
                                  }
                              )
                          )
                        TemplateSize: =116
                        TemplatePadding: =4
                        ShowScrollbar: =true
                        Selectable: =false
                        TabIndex: =0
                        AccessibleLabel: ="Students for " & Text(varViewDate, "dddd mmmm d")
                        Height: |-
                          =Min(620, Max(124, 124 * CountRows(Filter(colMonthCells, DayNum = Day(varViewDate) && (State = "Open" || State = "Future")))))
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - conAttDayRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Fill: =ColorWhite
                              BorderColor: =ColorRule
                              BorderThickness: =1
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              PaddingTop: =8
                              PaddingBottom: =8
