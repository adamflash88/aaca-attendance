                                =If(varCanEditMonth && !IsBlank(LookUp(colMonthAtt, StudentId = varDetailKey.StudentId && DayNum = varDetailKey.DayNum && !IsDeleted)), DisplayMode.Edit, DisplayMode.Disabled)
                              OnSelect: |-
                                =With(
                                    {
                                        a: LookUp(colMonthAtt, StudentId = varDetailKey.StudentId && DayNum = varDetailKey.DayNum && !IsDeleted),
                                        nm: LookUp(colMonthStudents, StudentId = varDetailKey.StudentId).StudentName,
                                        dt: Text(Date(Year(varMonthStart), Month(varMonthStart), varDetailKey.DayNum), "ddd mmm d"),
                                        newNotes: txtAttDetailNotes.Text
                                    },
                                    If(
                                        IsBlank(a) || !varCanEditMonth,
                                        Set(varLastAction, {Kind: "Blocked", Message: "Notes not saved · " & nm & " · " & dt & " · no record, month locked or view-only role", StudentId: varDetailKey.StudentId, DayNum: varDetailKey.DayNum}),
                                        With(
                                            {server: With({qAttId: a.AttId}, LookUp(Attendance, ThisRecord.Attendance = qAttId))},
                                            If(
                                                IsError(server),
                                                Set(varLastAction, {Kind: "Failed", Message: "Failed · " & nm & " · " & dt & " · notes were not saved — press Save notes to retry", StudentId: varDetailKey.StudentId, DayNum: varDetailKey.DayNum}),
                                                IsBlank(server) || server.'Modified On' <> a.ModifiedOn,
                                                RemoveIf(colMonthAtt, AttId = a.AttId);
                                                If(!IsBlank(server), Collect(colMonthAtt, {AttId: server.Attendance, StudentId: server.Student.Student, DayNum: Day(server.Date), AttDate: server.Date, Present: server.Present = true, IsDeleted: server.'Is Deleted' = true, Letter: If(server.Present = true, "P", server.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "E", server.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "U", "A"), ClassText: If(server.Present = true, "—", IsBlank(server.'Absence Classification'), "Not classified", Text(server.'Absence Classification')), IepText: Text(server.'IEP Ratio'), Notes: server.Notes, RecordKey: server.'Record Key', ModifiedOn: server.'Modified On'}));
                                                Reset(txtAttDetailNotes);
                                                Set(varLastAction, {Kind: "Conflict", Message: "Changed by someone else — reloaded · " & nm & " · " & dt & " · your notes were not saved", StudentId: varDetailKey.StudentId, DayNum: varDetailKey.DayNum}),
                                                With(
                                                    {written: IfError(Patch(Attendance, server, {Notes: newNotes}), Blank())},
                                                    If(
                                                        IsBlank(written),
                                                        Set(varLastAction, {Kind: "Failed", Message: "Failed · " & nm & " · " & dt & " · notes were not saved — press Save notes to retry", StudentId: varDetailKey.StudentId, DayNum: varDetailKey.DayNum}),
                                                        RemoveIf(colMonthAtt, AttId = a.AttId);
                                                        Collect(colMonthAtt, {AttId: written.Attendance, StudentId: written.Student.Student, DayNum: Day(written.Date), AttDate: written.Date, Present: written.Present = true, IsDeleted: written.'Is Deleted' = true, Letter: If(written.Present = true, "P", written.'Absence Classification' = 'Absence Classification (Attendance)'.Excused, "E", written.'Absence Classification' = 'Absence Classification (Attendance)'.Unexcused, "U", "A"), ClassText: If(written.Present = true, "—", IsBlank(written.'Absence Classification'), "Not classified", Text(written.'Absence Classification')), IepText: Text(written.'IEP Ratio'), Notes: written.Notes, RecordKey: written.'Record Key', ModifiedOn: written.'Modified On'});
                                                        Set(varLastAction, {Kind: "Notes", Message: "Notes saved · " & nm & " · " & dt & " · Notes """ & Left(written.Notes, 80) & If(Len(written.Notes) > 80, "…", "") & """ · Key " & written.'Record Key', StudentId: varDetailKey.StudentId, DayNum: varDetailKey.DayNum})
                                                    )
