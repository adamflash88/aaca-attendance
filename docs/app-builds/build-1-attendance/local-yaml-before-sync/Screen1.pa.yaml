Screens:
  Screen1:
    Properties:
      Fill: =ColorPaper
      OnVisible: =Select(btnAttLoadEngine)
    Children:
      - conAttRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =8
            PaddingTop: =0
            PaddingBottom: =16
            PaddingLeft: =0
            PaddingRight: =0
            Fill: =ColorPaper
            DropShadow: =DropShadow.None
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
          Children:
            - conAttHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =If(conAttRoot.Width < 640, 92, 76)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =ColorInk
                  PaddingTop: =12
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutGap: =4
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                Children:
                  - lblAttTitle:
                      Control: ModernText
                      Properties:
                        Text: ="AACA Attendance"
                        AccessibleLabel: ="AACA Attendance"
                        Size: =20
                        FontWeight: =FontWeight.Bold
                        Color: =ColorWhite
                        Wrap: =false
                        Height: =28
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - lblAttIdentity:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =Coalesce(CurrentUserRow.'Full Name', User().FullName) & " · " & RoleLabel & " · " & If(!StaffReady, "no campus", IsBlank(CurrentStaff.Campus), "All campuses", CurrentStaff.Campus.Name)
                        AccessibleLabel: ="Signed in as " & Self.Text
                        Size: =12
                        Color: =ColorInkSoft
                        Wrap: =true
                        Height: =If(conAttRoot.Width < 640, 36, 20)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
            - conAttNotSetUp:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =!StaffReady
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =If(conAttRoot.Width < 640, 168, conAttRoot.Width < 1024, 128, 112)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =ColorWhite
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutGap: =8
                Children:
                  - lblAttNotSetUpTitle:
                      Control: ModernText
                      Properties:
                        Text: ="You're not set up yet"
                        AccessibleLabel: ="You're not set up yet"
                        Size: =16
                        FontWeight: =FontWeight.Semibold
                        Color: =ColorInk
                        Wrap: =false
                        Height: =24
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - lblAttNotSetUpBody:
                      Control: ModernText
                      Properties:
                        Text: |-
                          ="Your sign-in (" & User().Email & ") is not linked to an active Staff record. Ask a System Admin to add a Staff row linked to your Users record, then reopen the app."
                        AccessibleLabel: =Self.Text
                        Size: =14
                        Color: =ColorInk
                        Wrap: =true
                        Height: =If(conAttRoot.Width < 640, 104, conAttRoot.Width < 1024, 64, 48)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
            - conAttToolbar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =StaffReady
                  LayoutDirection: =If(conAttRoot.Width >= 1240, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =If(conAttRoot.Width >= 1240, 74, 206)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =ColorWhite
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  PaddingTop: =8
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutGap: =8
                Children:
                  - conAttMonthNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Width: =380
                        Height: =58
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutGap: =8
                      Children:
                        - btnAttPrevMonth:
                            Control: ModernButton
                            Properties:
                              Text: ="◀"
                              AccessibleLabel: ="Previous month"
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: =Set(varMonthStart, DateAdd(varMonthStart, -1, TimeUnit.Months)); Select(btnAttLoadEngine)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =44
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - lblAttMonth:
                            Control: ModernText
                            Properties:
                              Text: =Text(varMonthStart, "mmmm yyyy")
                              AccessibleLabel: ="Month " & Self.Text
                              Size: =16
                              FontWeight: =FontWeight.Bold
                              Color: =ColorInk
                              Align: =Align.Center
                              Wrap: =false
                              Height: =28
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Center
                              LayoutMinWidth: =100
                              LayoutMinHeight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - btnAttNextMonth:
                            Control: ModernButton
                            Properties:
                              Text: ="▶"
                              AccessibleLabel: ="Next month"
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: =Set(varMonthStart, DateAdd(varMonthStart, 1, TimeUnit.Months)); Select(btnAttLoadEngine)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =44
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - btnAttThisMonth:
                            Control: ModernButton
                            Properties:
                              Text: ="This month"
                              AccessibleLabel: ="Go to this month"
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              PaddingLeft: =6
                              PaddingRight: =6
                              DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: =Set(varMonthStart, Date(Year(Today()), Month(Today()), 1)); Set(varViewDate, Today()); Select(btnAttLoadEngine)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =88
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                  - conAttScope:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        FillPortions: =If(conAttRoot.Width >= 1240, 1, 0)
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =58
                        LayoutMinWidth: =300
                        LayoutMinHeight: =0
                        LayoutGap: =8
                      Children:
                        - conAttCampusField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =146
                              LayoutMinHeight: =0
                              LayoutGap: =4
                            Children:
                              - lblAttCampus:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Campus"
                                    AccessibleLabel: ="Campus"
                                    Size: =12
                                    Color: =ColorMuted
                                    Wrap: =false
                                    Height: =18
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - ddAttCampus:
                                  Control: ModernDropdown
                                  Properties:
                                    Items: =Sort(Campuses, Name, SortOrder.Ascending)
                                    ItemDisplayText: =ThisItem.Name
                                    Default: =varCampus
                                    DisplayMode: =If(CanPickCampus && !varLoading, DisplayMode.Edit, DisplayMode.Disabled)
                                    OnChange: |-
                                      =Set(varCampus, Self.Selected); Set(varTeacher, First(Sort(Filter(Staff, Campus.Campus = varCampus.Campus && 'App Role' = 'App Role (Staff)'.Teacher), Name, SortOrder.Ascending))); Select(btnAttLoadEngine)
                                    AccessibleLabel: ="Campus"
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Height: =36
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conAttTeacherField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =146
                              LayoutMinHeight: =0
                              LayoutGap: =4
                            Children:
                              - lblAttTeacher:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Teacher"
                                    AccessibleLabel: ="Teacher"
                                    Size: =12
                                    Color: =ColorMuted
                                    Wrap: =false
                                    Height: =18
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - ddAttTeacher:
                                  Control: ModernDropdown
                                  Properties:
                                    Items: |-
                                      =Sort(Filter(Staff, Campus.Campus = varCampus.Campus && 'App Role' = 'App Role (Staff)'.Teacher), Name, SortOrder.Ascending)
                                    ItemDisplayText: =ThisItem.Name
                                    Default: =varTeacher
                                    DisplayMode: =If(CanPickTeacher && !varLoading, DisplayMode.Edit, DisplayMode.Disabled)
                                    OnChange: =Set(varTeacher, Self.Selected); Select(btnAttLoadEngine)
                                    AccessibleLabel: ="Teacher"
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Height: =36
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                  - conAttViewGroup:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Width: =350
                        Height: =58
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutGap: =8
                      Children:
                        - tabAttView:
                            Control: ModernTabList
                            Properties:
                              Items: =["Month", "Day"]
                              ItemDisplayText: =ThisItem.Value
                              Default: |-
                                =If(conAttRoot.Width < 640, {Value: "Day"}, {Value: "Month"})
                              Appearance: =TabListAppearance.Subtle
                              TabSize: =TabSize.Small
                              BasePaletteColor: =ColorTeal
                              Color: =ColorInk
                              AccessibleLabel: ="Month or Day view"
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =160
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - btnAttDetailsMode:
                            Control: ModernButton
                            Properties:
                              Text: =If(varDetailsMode, "Details on", "Details mode")
                              AccessibleLabel: ="Details mode – tap a marked cell to open its details"
                              Appearance: =If(varDetailsMode, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =ColorTeal
                              Color: =If(varDetailsMode, ColorWhite, ColorInk)
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              OnSelect: =Set(varDetailsMode, !varDetailsMode); Set(varDetailOpen, false)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =130
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - btnAttReload:
                            Control: ModernButton
                            Properties:
                              Text: ="↻"
                              AccessibleLabel: ="Reload month"
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              DisplayMode: =If(varLoading, DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: =Select(btnAttLoadEngine)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =44
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
            - conAttNotice:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =StaffReady && lblAttNotice.Text <> ""
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =If(conAttRoot.Width < 640, 68, conAttRoot.Width < 1024, 56, 44)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =If(varLoadError <> "", ColorErrorBg, ColorWarnBg)
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  PaddingTop: =4
                  PaddingBottom: =4
                  PaddingLeft: =12
                  PaddingRight: =12
                  LayoutGap: =8
                Children:
                  - lblAttNotice:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =If(varLoadError <> "", "Could not load attendance — " & varLoadError & ". Use ↻ to try again.", !IsBlank(varMonthLock), Text(varMonthStart, "mmmm yyyy") & " is locked for " & varCampus.Name & " — " & Coalesce(varMonthLock.Reason, "no reason given") & ". Cells are read-only.", IsReadOnlyRole, "View only — the Read-only role cannot change attendance.", "")
                        AccessibleLabel: ="Notice " & Self.Text
                        Size: =13
                        Color: =ColorInk
                        Wrap: =true
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
            - spnAttLoading:
                Control: ModernSpinner
                Properties:
                  Visible: =varLoading
                  Label: ="Loading " & Text(varMonthStart, "mmmm yyyy") & "…"
                  LabelPosition: =SpinnerLabelPosition.After
                  AccessibleLabel: ="Loading attendance"
                  SpinnerColor: =ColorTeal
                  Color: =ColorInk
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =48
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
            - conAttReceipt:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =varLastAction.Kind <> ""
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =If(conAttRoot.Width < 640, 124, conAttRoot.Width < 1024, 72, 56)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: |-
                    =Switch(varLastAction.Kind, "Conflict", ColorWarnBg, "Failed", ColorErrorBg, "Blocked", ColorErrorBg, ColorInfoBg)
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  PaddingTop: =6
                  PaddingBottom: =6
                  PaddingLeft: =12
                  PaddingRight: =12
                  LayoutGap: =8
                Children:
                  - lblAttReceipt:
                      Control: ModernText
                      Properties:
                        Text: =varLastAction.Message
                        AccessibleLabel: ="Last action " & varLastAction.Message
                        Size: =13
                        Color: =ColorInk
                        Wrap: =true
                        VerticalAlign: =VerticalAlign.Middle
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - btnAttReceiptDismiss:
                      Control: ModernButton
                      Properties:
                        Text: ="Dismiss"
                        AccessibleLabel: ="Dismiss last action message"
                        Appearance: =ButtonAppearance.Secondary
                        Color: =ColorInk
                        Layout: =ButtonLayout.TextOnly
                        Size: =14
                        OnSelect: |-
                          =Set(varLastAction, {Kind: "", Message: "", StudentId: ZeroGuid, DayNum: 0})
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        Width: =88
                        Height: =44
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
            - conAttConfirm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =varConfirmOpen
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =If(conAttRoot.Width < 640, 164, 120)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =ColorErrorBg
                  BorderColor: =ColorUnexcused
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  PaddingTop: =12
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  LayoutGap: =8
                Children:
                  - lblAttConfirmText:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =With({a: LookUp(colMonthAtt, StudentId = varClearKey.StudentId && DayNum = varClearKey.DayNum && !IsDeleted), c: LookUp(colMonthCells, StudentId = varClearKey.StudentId && DayNum = varClearKey.DayNum)}, "Clear " & Switch(a.Letter, "P", "Present", "E", "Absent (excused)", "U", "Absent (unexcused)", "Absent") & " for " & c.StudentName & " on " & Text(c.CellDate, "dddd mmmm d") & "? The row is kept and marked deleted (audit logged); marking the day again restores it.")
                        AccessibleLabel: =Self.Text
                        Size: =14
                        Color: =ColorInk
                        Wrap: =true
                        Height: =If(conAttRoot.Width < 640, 88, 44)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - conAttConfirmActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =44
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutGap: =8
                      Children:
                        - btnAttConfirmClear:
                            Control: ModernButton
                            Properties:
                              Text: ="Confirm clear"
                              AccessibleLabel: ="Confirm clear"
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =ColorUnexcused
                              Color: =ColorWhite
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              OnSelect: |-
                                =Set(varConfirmOpen, false); Set(varSaveReq, {StudentId: varClearKey.StudentId, DayNum: varClearKey.DayNum, Target: "clear"}); Select(btnAttSaveEngine)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =132
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - btnAttConfirmCancel:
                            Control: ModernButton
                            Properties:
                              Text: ="Cancel"
                              AccessibleLabel: ="Cancel clear"
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              OnSelect: |-
                                =Set(varConfirmOpen, false); Set(varLastAction, {Kind: "Cancelled", Message: "Clear cancelled · " & LookUp(colMonthCells, StudentId = varClearKey.StudentId && DayNum = varClearKey.DayNum).StudentName & " · " & Text(Date(Year(varMonthStart), Month(varMonthStart), varClearKey.DayNum), "ddd mmm d") & " · record unchanged", StudentId: varClearKey.StudentId, DayNum: varClearKey.DayNum})
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =96
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
            - conAttDetail:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =varDetailOpen
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =If(conAttRoot.Width < 640, 308, 264)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Fill: =ColorWhite
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutGap: =8
                Children:
                  - lblAttDetailTitle:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =LookUp(colMonthStudents, StudentId = varDetailKey.StudentId).StudentName & " · " & Text(Date(Year(varMonthStart), Month(varMonthStart), varDetailKey.DayNum), "dddd mmmm d, yyyy")
                        AccessibleLabel: ="Details for " & Self.Text
                        Size: =16
                        FontWeight: =FontWeight.Semibold
                        Color: =ColorInk
                        Wrap: =true
                        Height: =If(conAttRoot.Width < 640, 44, 24)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - lblAttDetailFacts:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =With({a: LookUp(colMonthAtt, StudentId = varDetailKey.StudentId && DayNum = varDetailKey.DayNum && !IsDeleted)}, If(IsBlank(a), "No attendance record for this cell.", "Status " & Switch(a.Letter, "P", "Present", "E", "Absent (excused)", "U", "Absent (unexcused)", "Absent (not classified)") & "  ·  IEP ratio " & Coalesce(a.IepText, "—") & "  ·  Classification " & a.ClassText & " (read-only)  ·  Reason " & Coalesce(With({qAttId: a.AttId}, LookUp(Attendance, ThisRecord.Attendance = qAttId)).'Absence Reason'.Name, "—") & "  ·  Key " & a.RecordKey))
                        AccessibleLabel: =Self.Text
                        Size: =13
                        Color: =ColorInk
                        Wrap: =true
                        Height: =If(conAttRoot.Width < 640, 68, 44)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                  - conAttDetailNotesField:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =96
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutGap: =4
                      Children:
                        - lblAttDetailNotesLabel:
                            Control: ModernText
                            Properties:
                              Text: ="Notes"
                              AccessibleLabel: ="Notes"
                              Size: =12
                              FontWeight: =FontWeight.Semibold
                              Color: =ColorMuted
                              Wrap: =false
                              Height: =20
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
