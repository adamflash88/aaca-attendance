Screens:
  StudentsScreen:
    Properties:
      Fill: =ColorPaper
      OnVisible: =Set(varStuMode, ""); Set(varStuAttAfter, 0); Select(btnStuLoadEngine)
    Children:
      - conStuRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =8
            PaddingBottom: =16
            Fill: =ColorPaper
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            DropShadow: =DropShadow.None
          Children:
            - conStuHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =4
                  PaddingTop: =12
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  Fill: =ColorInk
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =If(conStuRoot.Width < 640, 92, 76) + If(CanManageStudents, 48, 0)
                Children:
                  - lblStuTitle:
                      Control: ModernText
                      Properties:
                        Text: ="AACA Attendance"
                        AccessibleLabel: ="AACA Attendance"
                        Size: =20
                        FontWeight: =FontWeight.Bold
                        Color: =ColorWhite
                        Height: =28
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                  - lblStuIdentity:
                      Control: ModernText
                      Properties:
                        Text: =Coalesce(CurrentUserRow.'Full Name', User().FullName) & " · " & RoleLabel & " · " & If(!StaffReady, "no campus", IsBlank(CurrentStaff.Campus), "All campuses", CurrentStaff.Campus.Name)
                        AccessibleLabel: =Self.Text
                        Size: =12
                        Color: =ColorInkSoft
                        Height: =If(conStuRoot.Width < 640, 36, 20)
                        Wrap: =true
                        VerticalAlign: =VerticalAlign.Top
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                  - conStuNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =CanManageStudents
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        Height: =44
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - btnStuNavAttendance:
                            Control: ModernButton
                            Properties:
                              Text: ="Attendance"
                              AccessibleLabel: ="Go to Attendance"
                              OnSelect: =Navigate(Screen1)
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              Width: =120
                              Height: =44
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - btnStuNavStudents:
                            Control: ModernButton
                            Properties:
                              Text: ="Students"
                              AccessibleLabel: ="Students (current screen)"
                              OnSelect: =Navigate(StudentsScreen)
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =ColorTeal
                              Color: =ColorWhite
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              Width: =120
                              Height: =44
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
            - conStuDenied:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =!CanManageStudents
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Fill: =ColorWhite
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =16 + 24 + 8 + If(conStuRoot.Width < 640, 88, 48) + 8 + 44 + 16
                Children:
                  - lblStuDeniedTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Students is not available for your role"
                        AccessibleLabel: ="Students is not available for your role"
                        Size: =16
                        FontWeight: =FontWeight.Semibold
                        Color: =ColorInk
                        Height: =24
                        Wrap: =false
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                  - lblStuDeniedBody:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =If(!StaffReady, "Your sign-in is not linked to an active Staff record. Ask a System Admin to set you up.", "Only the Attendance Office and System Admin roles can manage students. Teachers and Read-only users record and view attendance on the Attendance screen.")
                        AccessibleLabel: =Self.Text
                        Size: =14
                        Color: =ColorInk
                        Height: =If(conStuRoot.Width < 640, 88, 48)
                        Wrap: =true
                        VerticalAlign: =VerticalAlign.Top
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                  - btnStuDeniedBack:
                      Control: ModernButton
                      Properties:
                        Text: ="Back to Attendance"
                        AccessibleLabel: ="Back to Attendance"
                        OnSelect: =Navigate(Screen1)
                        Appearance: =ButtonAppearance.Secondary
                        Color: =ColorInk
                        Layout: =ButtonLayout.TextOnly
                        Size: =14
                        Width: =190
                        Height: =44
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Start
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
            - conStuNotice:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =CanManageStudents && varStuLoadError <> ""
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  PaddingTop: =4
                  PaddingBottom: =4
                  PaddingLeft: =12
                  PaddingRight: =12
                  Fill: =ColorErrorBg
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =If(conStuRoot.Width < 640, 68, 44)
                Children:
                  - lblStuNotice:
                      Control: ModernText
                      Properties:
                        Text: ="Could not load students — " & varStuLoadError & ". Use ↻ to try again."
                        AccessibleLabel: =Self.Text
                        Size: =13
                        Color: =ColorInk
                        Wrap: =true
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
            - spnStuLoading:
                Control: ModernSpinner
                Properties:
                  Visible: =varStuLoading
                  Label: ="Loading students…"
                  AccessibleLabel: ="Loading students"
                  SpinnerColor: =ColorTeal
                  Color: =ColorInk
                  Height: =48
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
            - conStuReceipt:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =varStuReceipt.Kind <> ""
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =4
                  PaddingTop: =8
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  Fill: =Switch(varStuReceipt.Kind, "Failed", ColorErrorBg, "Blocked", ColorErrorBg, "Cancelled", ColorWarnBg, ColorInfoBg)
                  BorderColor: =ColorRule
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =8 + If(conStuRoot.Width < 640, 84, 44) + If(CountRows(colStuReceiptLines) > 0, 4 + galStuReceipt.Height, 0) + 8
                Children:
                  - conStuReceiptTop:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Height: =If(conStuRoot.Width < 640, 84, 44)
                      Children:
                        - lblStuReceiptTitle:
                            Control: ModernText
                            Properties:
                              Text: =varStuReceipt.Title
                              AccessibleLabel: =varStuReceipt.Title
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =ColorInk
                              Wrap: =true
                              Height: =If(conStuRoot.Width < 640, 84, 44)
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Center
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - btnStuReceiptDismiss:
                            Control: ModernButton
                            Properties:
                              Text: ="Dismiss"
                              AccessibleLabel: ="Dismiss result"
                              OnSelect: |-
                                =Set(varStuReceipt, {Kind: "", Title: "", StudentId: ZeroGuid}); Clear(colStuReceiptLines)
                              Appearance: =ButtonAppearance.Secondary
                              Color: =ColorInk
                              Layout: =ButtonLayout.TextOnly
                              Size: =14
                              Width: =88
                              Height: =44
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                  - galStuReceipt:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: =colStuReceiptLines
                        Visible: =CountRows(colStuReceiptLines) > 0
                        WrapCount: =If(conStuRoot.Width < 640, 1, conStuRoot.Width < 1024, 2, 3)
                        TemplateSize: =40
                        TemplatePadding: =0
                        Height: =Min(400, RoundUp(CountRows(colStuReceiptLines) / If(conStuRoot.Width < 640, 1, conStuRoot.Width < 1024, 2, 3), 0) * 40)
                        Selectable: =false
                        TabIndex: =0
                        ShowScrollbar: =true
                        AccessibleLabel: ="Saved values"
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - conStuRcptRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              PaddingTop: =2
                              PaddingRight: =8
                              PaddingBottom: =2
                              PaddingLeft: =0
                              DropShadow: =DropShadow.None
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                            Children:
                              - lblStuRcptLabel:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.Label
                                    AccessibleLabel: =ThisItem.Label
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ColorMuted
                                    Wrap: =true
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =150
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - lblStuRcptValue:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.Value
                                    AccessibleLabel: =ThisItem.Label & " " & ThisItem.Value
                                    Size: =12
                                    Color: =ColorInk
                                    Wrap: =true
                                    VerticalAlign: =VerticalAlign.Top
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =1
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
            - conStuBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Visible: =CanManageStudents
                  LayoutDirection: =If(conStuRoot.Width >= 1024, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutAlignItems: =If(conStuRoot.Width >= 1024, LayoutAlignItems.Start, LayoutAlignItems.Stretch)
                  LayoutGap: =8
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =If(conStuRoot.Width >= 1024, Max(844, conStuRight.Height), If(conStuListPanel.Visible, 844 + 8, 0) + conStuRight.Height)
                Children:
                  - conStuListPanel:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =!(conStuRoot.Width < 1024 && (!IsBlank(varStuSelId) || varStuMode <> ""))
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        Fill: =ColorWhite
                        BorderColor: =ColorRule
                        BorderThickness: =1
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        DropShadow: =DropShadow.None
                        FillPortions: =If(conStuRoot.Width >= 1024, 2, 0)
                        AlignInContainer: =If(conStuRoot.Width >= 1024, AlignInContainer.Start, AlignInContainer.Stretch)
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Height: =844
                      Children:
                        - conStuListHead:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =44
                            Children:
                              - lblStuListTitle:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Students"
                                    AccessibleLabel: ="Students"
                                    Size: =20
                                    FontWeight: =FontWeight.Bold
                                    Color: =ColorInk
                                    Wrap: =false
                                    Height: =30
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =1
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =80
                                    LayoutMinHeight: =0
                              - btnStuReload:
                                  Control: ModernButton
                                  Properties:
                                    Text: ="↻"
                                    AccessibleLabel: ="Reload students"
                                    Tooltip: ="Reload students"
                                    OnSelect: =Select(btnStuLoadEngine)
                                    DisplayMode: =If(varStuLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                    Appearance: =ButtonAppearance.Secondary
                                    Color: =ColorInk
                                    Layout: =ButtonLayout.TextOnly
                                    Size: =14
                                    Width: =44
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - btnStuAdd:
                                  Control: ModernButton
                                  Properties:
                                    Text: ="+ Add student"
                                    AccessibleLabel: ="Add student"
                                    OnSelect: |-
                                      =Set(varStuMode, "add"); Set(varStuFormCampusId, If(StudentCampusLock <> ZeroGuid, StudentCampusLock, varStuScopeCampusId)); Set(varStuAttAfter, 0); Select(btnStuFormResetEngine)
                                    DisplayMode: =If(!varStuLoading && !varStuSaving, DisplayMode.Edit, DisplayMode.Disabled)
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =ColorTeal
                                    Color: =ColorWhite
                                    Layout: =ButtonLayout.TextOnly
                                    Size: =14
                                    Width: =140
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conStuSearchField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =58
                            Children:
                              - lblStuSearch:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Search name, student number or external ID"
                                    AccessibleLabel: ="Search name, student number or external ID"
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ColorMuted
                                    Wrap: =false
                                    Height: =18
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - txtStuSearch:
                                  Control: ModernTextInput
                                  Properties:
                                    Default: =""
                                    Type: =TextInputType.Search
                                    TriggerOutput: =TriggerOutput.Delayed
                                    Placeholder: ="e.g. Garcia, STU-000123 or SEED-0001"
                                    AccessibleLabel: ="Search name, student number or external ID"
                                    Appearance: =Appearance.Outline
                                    Color: =ColorInk
                                    Height: =36
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conStuScopeRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =58
                            Children:
                              - conStuCampusField:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =4
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =140
                                    LayoutMinHeight: =0
                                  Children:
                                    - lblStuCampus:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Campus"
                                          AccessibleLabel: ="Campus"
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ColorMuted
                                          Wrap: =false
                                          Height: =18
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                    - ddStuCampus:
                                        Control: ModernDropdown
                                        Properties:
                                          Items: =colStuCampusOpts
                                          ItemDisplayText: =ThisItem.CampusName
                                          Default: =LookUp(colStuCampusOpts, CampusId = varStuScopeCampusId)
                                          DisplayMode: =If(StudentCampusLock = ZeroGuid && !varStuLoading, DisplayMode.Edit, DisplayMode.Disabled)
                                          OnChange: =Set(varStuScopeCampusId, Coalesce(Self.Selected.CampusId, ZeroGuid)); Set(varStuTeacherFilterId, ZeroGuid); Reset(ddStuTeacher)
                                          AccessibleLabel: ="Campus"
                                          Appearance: =Appearance.Outline
                                          Color: =ColorInk
                                          Height: =36
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                              - conStuTeacherField:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =4
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =140
                                    LayoutMinHeight: =0
                                  Children:
                                    - lblStuTeacher:
                                        Control: ModernText
                                        Properties:
                                          Text: ="Teacher"
                                          AccessibleLabel: ="Teacher"
                                          Size: =12
                                          FontWeight: =FontWeight.Semibold
                                          Color: =ColorMuted
                                          Wrap: =false
                                          Height: =18
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                    - ddStuTeacher:
                                        Control: ModernDropdown
                                        Properties:
                                          Items: =Filter(colStuTeacherOpts, TeacherId = ZeroGuid || varStuScopeCampusId = ZeroGuid || CampusId = varStuScopeCampusId)
                                          ItemDisplayText: =ThisItem.TeacherName
                                          Default: =LookUp(colStuTeacherOpts, TeacherId = varStuTeacherFilterId)
                                          OnChange: =Set(varStuTeacherFilterId, Coalesce(Self.Selected.TeacherId, ZeroGuid))
                                          AccessibleLabel: ="Teacher"
                                          Appearance: =Appearance.Outline
                                          Color: =ColorInk
                                          Height: =36
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                        - conStuStatusField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =58
                            Children:
                              - lblStuStatus:
                                  Control: ModernText
                                  Properties:
                                    Text: ="Status"
                                    AccessibleLabel: ="Status"
                                    Size: =12
                                    FontWeight: =FontWeight.Semibold
                                    Color: =ColorMuted
                                    Wrap: =false
                                    Height: =18
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - rdoStuStatus:
                                  Control: ModernRadio
                                  Properties:
                                    Items: =["Active", "Inactive", "Archived", "All"]
                                    ItemDisplayText: =ThisItem.Value
                                    Default: |-
                                      ={Value: "Active"}
                                    Layout: =OptionLayout.Horizontal
                                    AccessibleLabel: ="Status filter"
                                    Color: =ColorInk
                                    Height: =36
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conStuFilterActions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =44
                            Children:
                              - tglStuArchived:
                                  Control: ModernToggle
                                  Properties:
                                    Label: ="Include archived"
                                    LabelPosition: =ToggleLabelPosition.After
                                    Default: =false
                                    AccessibleLabel: ="Include archived students"
                                    Color: =ColorInk
                                    Width: =180
                                    Height: =44
                                    FillPortions: =0
